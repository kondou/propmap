<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>PropMap v1.0.2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
@keyframes _blink { 0%{opacity:1} 71.43%{opacity:0.15} 100%{opacity:1} }
.blink { animation: _blink 700ms linear infinite; }
@keyframes _ka { 0%{transform:translateX(0)} 50%{transform:translateX(0.001px)} 100%{transform:translateX(0)} }
body { background: #111; color: #ccc; font-family: system-ui, sans-serif; font-size: 13px;
  display:flex; flex-direction:column; overflow:hidden; }
#app { flex:1; display:flex; flex-direction:column; padding:6px; min-height:0; overflow:hidden; }
.cg { display: flex; align-items: center; gap: 4px; flex-shrink:0; }
label { color: #888; font-size: 11px; }
select { font-size: 11px; background:#1a2535; color:#ddd; border:1px solid #334; border-radius:3px; }

button { font-size:11px; padding:2px 9px; background:#1a2535;

#main-row { display:flex; gap:8px; min-height:0; overflow:hidden; }
/* 左: 地図（常に正方形） */
#map-wrap { position:relative; flex:none; user-select:none; overflow:hidden; }
canvas#cv { display:block; cursor:crosshair; }
#overlay-info {

#controls { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }

.chart-wrap { position:relative; flex:1; min-height:0; }
.chart-row { display:flex; flex:1; min-height:0; }
.band-labels { width:36px; flex-shrink:0; position:relative; font-size:9px; font-weight:bold; }
.band-label-item { position:absolute; right:2px; transform:translateY(-50%); white-space:nowrap; }
.chart-bg { display:block; width:100%; height:100%; }
.chart-ov { position:absolute; top:0; left:0; pointer-events:none; display:block; }
#band-legend { display:none; }
.band-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:2px; }

<script>
async function loadJSON(paths){
  for(const p of paths){
    try{ const r=await fetch(p); if(r.ok)return await r.json(); }catch(e){}
  }
  return null;
}

// ズーム倍率: 1.15 (変更候補: 1.3=旧値, 2.0=旧クリック倍率)
const ZOOM_FACTOR=1.15;
// 太陽位置計算（UTC分から太陽の赤緯・経度を計算）
let _spKey='',_spData=[];
function solarPosition(utcMinutes){
  // IARU=7月中旬(day≒196), CQ WW CW=11月末(day≒330), CQ WW SSB=10月末(day≒304)
  const key=document.getElementById('sel-contest').value;
  if(key!==_spKey){
    _spKey=key;
    const day=key==='cqww_cw'?330:key==='cqww_ssb'?304:
              key==='cqwpx_cw'?140:key==='cqwpx_ssb'?70:196;
    const decl=23.45*Math.sin((360/365*(day-81))*Math.PI/180);
    _spData=Array.from({length:1440},(_,m)=>{
      const l=-(m/60-12)*15;
      return{lat:decl,lon:((l+180)%360+360)%360-180};
    });
  }
  return _spData[(utcMinutes|0)%1440];
}

// 大圏距離(km)計算
function gcDist(lat1,lon1,lat2,lon2){
  const R=6371,p=Math.PI/180;
  const a=Math.sin((lat2-lat1)*p/2)**2+
    Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin((lon2-lon1)*p/2)**2;
  return 2*R*Math.asin(Math.sqrt(Math.min(1,a)));
}
function getBright(){ return (+document.getElementById('sld-bright').value)/100; }
const SCALE_DEFAULT=6000,SCALE_MIN=300,SCALE_MAX=20000;
// Radiusスライダーのキリ番ステップテーブル（index 0〜）
const RADIUS_STEPS=[300,500,700,1000,1500,2000,2500,3000,4000,5000,
                    6000,7000,8000,9000,10000,12000,14000,15000,16000,17000,
                    18000,19000,20000];
function radiusToSliderIdx(km){
  let best=0,bd=Infinity;
  RADIUS_STEPS.forEach((v,i)=>{const d=Math.abs(v-km);if(d<bd){bd=d;best=i;}});
  return best;
}
function sliderIdxToRadius(i){return RADIUS_STEPS[Math.min(i,RADIUS_STEPS.length-1)];}
function syncRadiusSlider(){
  const idx=radiusToSliderIdx(radiusKm);
  const sl=document.getElementById('sld-radius');
  if(sl){sl.max=RADIUS_STEPS.length-1;sl.value=idx;}
  const lb=document.getElementById('lbl-radius');
  if(lb)lb.textContent=radiusKm.toLocaleString()+'km';
}
let CX=-0.8,CY=52.5,QX=-0.8,QY=52.5;
const CX0=-0.8,CY0=52.5;
let radiusKm=SCALE_DEFAULT;
let viewS=1,viewTX=0,viewTY=0;
let dragStartTX=0,dragStartTY=0;
let allData=null,worldFeatures=null,animTimer=null,rtTimer=null,chartRafId=null,_rtRafId=null;
let _offscreen=null,_offscreenKey=null; // 地形図+ベアリング+リングのキャッシュ
// 点滅: 明→暗0.5秒、暗→明0.2秒の非対称サイクル
let _blinkAlpha=1.0,_blinkRaf=null,_blinkLastTs=null,_blinkDir=-1;
const BLINK_FADE=500,BLINK_RISE=200; // ms
function _blinkTick(){
  const now=performance.now();
  if(_blinkLastTs===null)_blinkLastTs=now;
  const dt=Math.min(now-_blinkLastTs,100);_blinkLastTs=now;
  _blinkAlpha+=_blinkDir*dt/(_blinkDir>0?BLINK_RISE:BLINK_FADE);
  if(_blinkAlpha<=0.15){_blinkAlpha=0.15;_blinkDir=1;}
  if(_blinkAlpha>=1.0){_blinkAlpha=1.0;_blinkDir=-1;}
  _redrawCellsOnly();
}
let _blinkCellCache=null;
let _arrowBlink={raf:null,gen:0,alphas:[]};
let _arrowCache=null;
function _redrawCellsOnly(){
  if(!_blinkCellCache||!_offscreen||SZ===0)return;
  const{entries,grids,rbnEnabled,rbnCount,rbnMaxC,rbnGrids,rxCount:qsoCount}=_blinkCellCache;
  const dcx=SZ/2,dcy=SZ/2,dR=SZ/2-4;
  c2.clearRect(0,0,SZ,SZ);
  c2.save();
  c2.beginPath();c2.arc(dcx,dcy,dR,0,Math.PI*2);c2.clip();
  c2.fillStyle='#000';c2.fillRect(0,0,SZ,SZ);
  c2.drawImage(_offscreen,0,0);
  c2.globalAlpha=_blinkAlpha;
  for(const[rx4,,col]of entries){
    const meta=grids[rx4];if(!meta)continue;
    c2.fillStyle=col;
    if(drawCell(meta.lat,meta.lon))c2.fill();
  }
  if(rbnEnabled&&rbnCount){
    for(const[rx4,cnt]of Object.entries(rbnCount)){
      if(rx4 in qsoCount)continue;
      const meta=(rbnGrids&&rbnGrids[rx4])||grids[rx4];if(!meta)continue;
      const col=rbnColor(cnt/rbnMaxC);if(!col)continue;
      c2.fillStyle=col;
      if(drawCell(meta.lat,meta.lon))c2.fill();
    }
  }
  c2.globalAlpha=1.0;
  c2.restore();
  // 外周円
  c2.beginPath();c2.arc(dcx,dcy,dR,0,Math.PI*2);
  c2.strokeStyle='rgba(255,255,255,0.20)';c2.lineWidth=1.5;c2.stroke();
  // 中心マーカー: パンモードかつ移動中は非表示
  const _panActive=document.getElementById('chk-pan')?.checked&&(viewTX!==0||viewTY!==0||viewS!==1);
  if(!_panActive){
    const cp=proj([CX,CY]);
    if(cp){
      c2.globalAlpha=centerLabelAlpha;
      c2.beginPath();c2.arc(cp[0],cp[1],4,0,Math.PI*2);
      c2.fillStyle='#ee4444';c2.fill();
      c2.strokeStyle='#fff';c2.lineWidth=1.5;c2.stroke();
      c2.fillStyle='#fff';c2.font='bold 11px sans-serif';c2.textAlign='left';c2.textBaseline='middle';
      c2.fillText(document.getElementById('inp-grid').value.toUpperCase(),cp[0]+6,cp[1]+4);
      c2.globalAlpha=1.0;
    }
    if(!document.getElementById('chk-fixed').checked&&(Math.abs(QX-CX)>0.1||Math.abs(QY-CY)>0.1)){
      const qp=proj([QX,QY]);
      if(qp){c2.beginPath();c2.arc(qp[0],qp[1],4,0,Math.PI*2);
        c2.fillStyle='#4af';c2.fill();c2.strokeStyle='#fff';c2.lineWidth=1;c2.stroke();}
    }
  }
  // N/E/S/W
  c2.textAlign='center';c2.textBaseline='middle';
  c2.fillStyle='rgba(255,255,255,0.30)';c2.font='10px sans-serif';
  [[`N`,dcx,dcy-dR+10],[`E`,dcx+dR-8,dcy],[`S`,dcx,dcy+dR-8],[`W`,dcx-dR+8,dcy]]
    .forEach(([l,x,y])=>{if(x>=0&&x<=SZ&&y>=0&&y<=SZ)c2.fillText(l,x,y);});
  // 三角インジケーター（Panモードで地図移動中は非表示）
  const _panActiveCells=document.getElementById('chk-pan')?.checked&&(viewTX!==0||viewTY!==0||viewS!==1);
  if(!_panActiveCells&&_arrowCache&&_arrowCache.length>0){
    const alphas=_arrowBlink.alphas;
    _drawArrowsOnCanvas(_arrowCache,alphas&&alphas.length===_arrowCache.length?alphas:null);
  }
}

function getUTCStep(){ return +document.getElementById('sld-hour').value; }

function getQueryStep(){
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??60;
  const stepsPerDay=allData?.meta?.steps_per_day??24;
  const startStep=Math.round(cfg.startHour*60/resMin);
  const raw=startStep + getUTCStep();
  // 48hコンテスト: t_stepは0〜(stepsPerDay*2-1)で一意、折り返しなし
  // 24hコンテスト: 従来通り % stepsPerDay
  return cfg.hours===48 ? raw : raw % stepsPerDay;
}

function fmtTime(val){
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??60;
  const stepsPerDay=allData?.meta?.steps_per_day??24;
  const startStep=Math.round(cfg.startHour*60/resMin);
  // 48時間コンテストは通算分数で計算（折り返しなし）
  const totalMin=(cfg.hours===48)
    ? (startStep+val)*resMin
    : ((startStep+val)%stepsPerDay)*resMin;
  return String(Math.floor(totalMin/60)).padStart(2,'0')+':'+String(totalMin%60).padStart(2,'0');
}

    ? (startStep+val)*resMin

function buildProj(){
  // 高さ基準でcanvasサイズを決める
  // まずmap-wrapの固定サイズをリセットし、フレックスレイアウトから正しいサイズを取得
  const mapWrap=cv.parentElement;

  // layout再計算のため offsetHeight を参照
  // [レイアウト切り替え] 閾値830px以下で縦積み、超で横並び
  // 元に戻す場合: このブロック全体を削除し、元のSZ=行を復元する
  const _mainRow=cv.parentElement.parentElement;
  const _rc=document.getElementById('right-col');
  const _THRESHOLD=830;
  const _vertical=(window.innerWidth<=_THRESHOLD);
  if(_vertical){
    // 縦積み: 地図はウィンドウ幅フル（padding分を引く）、グラフは地図高さの1.5倍まで
    _mainRow.style.flexDirection='column';
    SZ=Math.min(window.innerWidth-10, window.innerHeight);
    if(SZ<100)SZ=window.innerWidth-10;
    if(_rc){
      _rc.style.maxHeight=Math.floor(SZ*2.2)+'px';
      _rc.style.overflowY='hidden';
      _rc.style.width='';
    }
  } else {
    // 横並び: 地図幅はウィンドウ幅の75%まで、グラフは地図と同じ高さ
    _mainRow.style.flexDirection='row';
    const _maxSZ=Math.floor(window.innerWidth*0.75);
    SZ=Math.min(mapWrap.offsetHeight||mapWrap.offsetWidth, _maxSZ);
    if(SZ<100)SZ=mapWrap.offsetWidth;
    if(_rc){
      _rc.style.maxHeight=SZ+'px';
      _rc.style.overflowY='hidden';
      _rc.style.width='';
    }
  }
  // SZ=mapWrap.offsetHeight||mapWrap.offsetWidth;  // 元のコード
  cv.width=SZ; cv.height=SZ;
  mapWrap.style.width=SZ+'px';
  mapWrap.style.height=SZ+'px';
  mapWrap.style.position='relative';
  // map-brightをmap-wrapの左下に配置
  const mb=document.getElementById('map-bright');
  if(mb){
    mb.style.position='absolute';
    mb.style.bottom='8px';
    mb.style.left='8px';
    mb.style.top='';
  }
  // overlay-infoとradius-ctrlの初期配置（drawMap後に正確な位置が確定）
  const oi=document.getElementById('overlay-info');
  if(oi){
    oi.style.position='absolute';
    oi.style.right='8px';
    oi.style.top='';
    oi.style.left='';
    // bottom は drawMap() 内で radius-ctrl の高さを基準に設定
  }
  const rc2=document.getElementById('radius-ctrl');
  if(rc2){
    rc2.style.position='absolute';
    rc2.style.right='8px';
    rc2.style.bottom='8px';
    rc2.style.top='';
  }
  proj=d3.geoAzimuthalEquidistant()
    .rotate([-CX,-CY])
    .scale((SZ/2-8)/(radiusKm/6371)*viewS)
    .translate([SZ/2+viewTX,SZ/2+viewTY]);
}

function pixelToGeo(px,py){
  const sc=(SZ/2-8)/(radiusKm/6371)*viewS;
  const tx=SZ/2+viewTX,ty=SZ/2+viewTY;
  const x=(px-tx)/sc,y=(py-ty)/sc;
  const rho=Math.sqrt(x*x+y*y);
  if(rho<1e-10)return[CX,CY];
  if(rho>Math.PI)return null;
  const cx=CX*Math.PI/180,cy=CY*Math.PI/180;
  const lat=Math.asin(Math.cos(rho)*Math.sin(cy)+(-y*Math.sin(rho)*Math.cos(cy)/rho));
  const lon=cx+Math.atan2(x*Math.sin(rho),rho*Math.cos(cy)*Math.cos(rho)+y*Math.sin(cy)*Math.sin(rho));
  return[lon*180/Math.PI,lat*180/Math.PI];
}

function geoToGrid4(lon,lat){
  const FL='ABCDEFGHIJKLMNOPQR';
  const fi=Math.max(0,Math.min(17,Math.floor((lon+180)/20)));
  const ri=Math.max(0,Math.min(17,Math.floor((lat+90)/10)));
  const si=Math.max(0,Math.min(9,Math.floor(((lon+180)%20)/2)));
  const sj=Math.max(0,Math.min(9,Math.floor((lat+90)%10)));
  return FL[fi]+FL[ri]+si+sj;
}

let dragStart=null,dragStartCX=null,dragStartCY=null,isDragging=false;
const DRAG_THR=5;
let centerLabelAlpha=0.20;
let _cLabelFadeTimer=null,_cLabelFadeRaf=null;
const C_LABEL_DIM=0.20,C_LABEL_FADE_MS=600;
function _cancelCenterFade(){
  if(_cLabelFadeTimer){clearTimeout(_cLabelFadeTimer);_cLabelFadeTimer=null;}
  if(_cLabelFadeRaf){cancelAnimationFrame(_cLabelFadeRaf);_cLabelFadeRaf=null;}
}
function _startCenterFade(){
  const t0=performance.now(),a0=centerLabelAlpha;
  function step(ts){
    const p=Math.min(1,(ts-t0)/C_LABEL_FADE_MS);
    centerLabelAlpha=a0+(C_LABEL_DIM-a0)*p;
    _skipCharts=true;drawMap(true);_skipCharts=false;
    if(p<1)_cLabelFadeRaf=requestAnimationFrame(step);
    else{_cLabelFadeRaf=null;centerLabelAlpha=C_LABEL_DIM;}
  }
  _cLabelFadeRaf=requestAnimationFrame(step);
}
function _scheduleCenterFade(){
  _cancelCenterFade();
  _cLabelFadeTimer=setTimeout(_startCenterFade,3000);
}

cv.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  _cancelCenterFade(); centerLabelAlpha=1.0;
  const rect=cv.getBoundingClientRect();
  dragStart={x:(e.clientX-rect.left)*(SZ/rect.width),
             y:(e.clientY-rect.top)*(SZ/rect.height)};
  dragStartCX=CX; dragStartCY=CY;
  dragStartTX=viewTX; dragStartTY=viewTY;
  isDragging=false;
  e.preventDefault();
});

cv.addEventListener('mousemove',e=>{
  if(!dragStart)return;
  const rect=cv.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(SZ/rect.width);
  const py=(e.clientY-rect.top)*(SZ/rect.height);
  const dx=px-dragStart.x,dy=py-dragStart.y;
  if(!isDragging&&Math.sqrt(dx*dx+dy*dy)<DRAG_THR)return;
  isDragging=true; cv.style.cursor='grabbing';
  if(document.getElementById('chk-pan')?.checked){
    viewTX=dragStartTX+dx;
    viewTY=dragStartTY+dy;
    drawMap();
  } else {
    const sc=(SZ/2-8)/(radiusKm/6371);
    const latRad=dragStartCY*Math.PI/180;
    CX=((dragStartCX+(-dx/viewS/sc)*(180/Math.PI)/Math.cos(latRad)+180)%360+360)%360-180;
    CY=Math.max(-85,Math.min(85,dragStartCY-(-dy/viewS/sc)*(180/Math.PI)));
    if(!document.getElementById('chk-fixed').checked){QX=CX;QY=CY;}
    const newGrid=geoToGrid4(CX,CY);
    document.getElementById('inp-grid').value=newGrid;
    setApplyDirty(true);
    drawMap();
  }
});

function endDrag(e){
  if(!dragStart)return;
  dragStart=null; isDragging=false; cv.style.cursor='crosshair';

}

let _wheelPending=false, _skipCharts=false, _chartDebounce=null;
cv.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();
  if(document.getElementById('chk-pan')?.checked){
    // Panモード: 投影レベルzoom-to-cursor（ベクター品質）
    const cx=e.offsetX,cy=e.offsetY;
    // deltaY>0=ピンチクローズ/下スクロール=縮小
    const factor=e.deltaY>0?1/ZOOM_FACTOR:ZOOM_FACTOR;
    // 全球表示時（地球外周円がディスク内に収まる）がズームアウト限界
    // globeR = scale*π; 条件: panOffset + globeR ≤ R → sMin = (R - panOffset)/(SZ/2-8) * radiusKm/(6371*π)
    const panOffset=Math.sqrt(viewTX*viewTX+viewTY*viewTY);
    const sMin=Math.max(1e-3,(SZ/2-4-panOffset)/(SZ/2-8)*radiusKm/(6371*Math.PI));
    const newS=Math.max(sMin,Math.min(20,viewS*factor));
    if(newS!==viewS){
      viewTX=cx-SZ/2-(newS/viewS)*(cx-SZ/2-viewTX);
      viewTY=cy-SZ/2-(newS/viewS)*(cy-SZ/2-viewTY);
      viewS=newS;
    }
  } else {
    // 通常モード: 投影スケール変更（radiusKm）
    // ZOOM_FACTOR=1.15 (変更候補: 1.3)
    radiusKm=e.deltaY>0?Math.min(SCALE_MAX,radiusKm*ZOOM_FACTOR):Math.max(SCALE_MIN,radiusKm/ZOOM_FACTOR);
  }
  _skipCharts=true; // ズーム中はチャート更新をスキップ
  if(!_wheelPending){
    _wheelPending=true;
    requestAnimationFrame(()=>{_wheelPending=false;drawMap();});
  }
  // ホイール停止後200msでチャートを1回更新
  clearTimeout(_chartDebounce);
  _chartDebounce=setTimeout(()=>{_skipCharts=false;updateCharts();},200);
},{passive:false});

function _setupChartHover(wrapId, bgId, key, keyLabel){

  wrap.addEventListener('mousemove',e=>{

    const {PAD,totalSteps,pxPerStep,W,data,sumByStep,resMin,startUTCmin,halfSteps}=cache;
    const nowIdx=cache.startContestIdx; // 現在の中心インデックス
    const nowX=PAD.l+(W-PAD.l-PAD.r)/2;
    const rect=wrap.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    // X座標からコンテストインデックスを計算
    const ci=Math.round(nowIdx+(mx-nowX)/pxPerStep);
    if(ci<0||ci>=totalSteps){tip.style.display='none';return;}
    const refCi=ci;
    // UTC時刻文字列
    const utcMin=((startUTCmin+refCi*resMin)%(24*60)+24*60)%(24*60);

    for(let b=1;b<=6;b++){
      const v=data[b][refCi]?.[key]??0;
      if(v>0)items.push({b,v});
    }
    items.sort((a,b2)=>b2.v-a.v);
    const keyLabel2=keyLabel??(key==='qso'?'QSO':'Grids');
    let html=`<span style="color:#99a">${timeStr}</span>`;
    if(items.length===0){
      html+=`<br><span style="color:#666">No ${keyLabel2}</span>`;
    } else {
      for(const{b,v}of items){
        html+=`<br><span style="color:${BAND_COLORS[b]}">${BAND_NAMES[b]}</span> ${v} ${keyLabel2}`;
      }
    }
    tip.innerHTML=html;

    const x=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8);
    const y=Math.min(e.clientY+18,window.innerHeight-tip.offsetHeight-8);

  });
  wrap.addEventListener('mouseleave',()=>{tip.style.display='none';});
}
function getFilters(){
  const distKm=+document.getElementById('sld-lon').value;
  // power: 0=High(フィルタなし), 1=QRP(1のみ), 2=Low(1,2のみ)
  const powerMax=+document.getElementById('sel-power').value;
  return{band:+document.getElementById('sel-band').value,
         mode:+document.getElementById('sel-mode').value,
         powerMax,
         tStep:getQueryStep(),
         lonRange:distKm/111,
         distKm:distKm};
}

function queryHeatmap(f){
  if(!allData)return{};
  const cnt={};
  const recs=_stepIndex?_stepIndex[f.tStep]:allData.records;
  if(!recs)return cnt;
  for(const rec of recs){
    if(f.band&&rec[1]!==f.band)continue;
    if(f.mode&&rec[2]!==f.mode)continue;
    if(!_stepIndex&&rec[3]!==f.tStep)continue;
    // rec[6]: power_code (0=UNKNOWN,1=QRP,2=LOW,3=HIGH) ※新フォーマットのみ
    // powerMax>0 の場合: rec[6]<=powerMax のもののみ（UNKNOWNは通す）
    if(f.powerMax>0&&rec[6]!=null&&rec[6]>0&&rec[6]>f.powerMax)continue;
    if(typeof rec[4]==='string'){
      const txMeta=allData.grids[rec[4]];
      if(!txMeta)continue;
      if(gcDist(QY,QX,txMeta.lat,txMeta.lon)>f.distKm)continue;
    } else {
      const lonMin=QX-f.lonRange,lonMax=QX+f.lonRange;
      if(rec[4]<lonMin||rec[4]>lonMax)continue;
    }
    cnt[rec[0]]=(cnt[rec[0]]||0)+rec[5];
  }
  return cnt;
}

// RBNデータのクエリ（フィルタ適用）: {grid4: count}
// 条件1: spotted局がDist内 → spotterのグリッドにパネル表示
// 条件2: spotter局がDist内 → spotted局のグリッドにパネル表示
// 両方Dist内の場合は両方のグリッドにそれぞれ加算
function queryRbn(f){
  if(!allRbnData||!_rbnStepIndex)return{};
  if(!document.getElementById('chk-rbn')?.checked)return{};
  const cnt={};
  const recs=_rbnStepIndex[f.tStep]||[];
  for(const rec of recs){
    if(f.band&&rec[1]!==f.band)continue;
    // RBNはCWのみ。モードフィルタがCW(1)またはAll(0)以外ならスキップ
    if(f.mode&&f.mode!==1)continue;
    if(f.powerMax>0&&rec[6]!=null&&rec[6]>0&&rec[6]>f.powerMax)continue;

    // rec[0]=spotted(rx4), rec[4]=spotter(tx4)
    const spottedGrid=allRbnData.grids[rec[0]]||allData?.grids[rec[0]];
    const spotterGrid=allRbnData.grids[rec[4]]||allData?.grids[rec[4]];

    // 条件1: spotted Dist内 → spotterのパネル
    if(spottedGrid&&gcDist(QY,QX,spottedGrid.lat,spottedGrid.lon)<=f.distKm){
      if(spotterGrid) cnt[rec[4]]=(cnt[rec[4]]||0)+rec[5];
    }
    // 条件2: spotter Dist内 → spotted局のパネル
    if(spotterGrid&&gcDist(QY,QX,spotterGrid.lat,spotterGrid.lon)<=f.distKm){
      if(spottedGrid) cnt[rec[0]]=(cnt[rec[0]]||0)+rec[5];
    }
  }
  return cnt;
}

// ---- カラー ------------------------------------------------------------
function heatColor(n){
  if(n<0.001)return null;
  n=Math.pow(n,0.35);
  const stops=[[0,[0,80,220]],[0.25,[0,200,220]],[0.45,[0,210,100]],
    [0.65,[220,210,0]],[0.82,[230,100,0]],[1.00,[210,0,0]]];
  let lo=stops[0],hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(n>=stops[i][0]&&n<=stops[i+1][0]){lo=stops[i];hi=stops[i+1];break;}
  }
  const t=lo[0]===hi[0]?0:(n-lo[0])/(hi[0]-lo[0]);
  return`rgb(${(lo[1][0]+(hi[1][0]-lo[1][0])*t)|0},${(lo[1][1]+(hi[1][1]-lo[1][1])*t)|0},${(lo[1][2]+(hi[1][2]-lo[1][2])*t)|0})`;
}

// RBN専用カラー: 暗紫(45,0,80) → マゼンタ(204,0,204) → 白(255,255,255)
function rbnColor(n){
  if(n<0.001)return null;
  n=Math.pow(n,0.35);
  const stops=[[0,[45,0,80]],[0.5,[204,0,204]],[1.0,[255,255,255]]];
  let lo=stops[0],hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(n>=stops[i][0]&&n<=stops[i+1][0]){lo=stops[i];hi=stops[i+1];break;}
  }
  const t=lo[0]===hi[0]?0:(n-lo[0])/(hi[0]-lo[0]);
  return`rgb(${(lo[1][0]+(hi[1][0]-lo[1][0])*t)|0},${(lo[1][1]+(hi[1][1]-lo[1][1])*t)|0},${(lo[1][2]+(hi[1][2]-lo[1][2])*t)|0})`;
}

// ---- セル描画 ----------------------------------------------------------
function drawCell(lat,lon){
  const pc=proj([lon,lat]),pe=proj([lon+2,lat]),pw=proj([lon-2,lat]);
  const pn=proj([lon,lat+1]),ps=proj([lon,lat-1]);
  if(!pc||!pe||!pw||!pn||!ps)return false;
  const eX=(pe[0]-pc[0])/2,eY=(pe[1]-pc[1])/2;
  const wX=(pw[0]-pc[0])/2,wY=(pw[1]-pc[1])/2;
  const nX=(pn[0]-pc[0])/2,nY=(pn[1]-pc[1])/2;
  const sX=(ps[0]-pc[0])/2,sY=(ps[1]-pc[1])/2;
  const sz=Math.sqrt(eX*eX+eY*eY)+Math.sqrt(nX*nX+nY*nY);
  if(sz<0.8||sz>SZ*0.3)return false;
  const x=pc[0],y=pc[1];
  c2.beginPath();
  c2.moveTo(x+wX+sX,y+wY+sY);c2.lineTo(x+eX+sX,y+eY+sY);
  c2.lineTo(x+eX+nX,y+eY+nY);c2.lineTo(x+wX+nX,y+wY+nY);
  c2.closePath();return true;
}

// ---- ベアリングライン --------------------------------------------------
function drawBearingLines(pg){
  c2.save();
  const br=getBright(); c2.strokeStyle=`rgba(255,255,255,${(0.18*br).toFixed(3)})`;c2.lineWidth=0.6;
  for(let brg=0;brg<360;brg+=30){
    const bRad=brg*Math.PI/180,pts=[];
    for(let km=100;km<=20000;km+=200){
      const d=km/6371,cx=CX*Math.PI/180,cy=CY*Math.PI/180;
      const lat2=Math.asin(Math.sin(cy)*Math.cos(d)+Math.cos(cy)*Math.sin(d)*Math.cos(bRad));
      const lon2=cx+Math.atan2(Math.sin(bRad)*Math.sin(d)*Math.cos(cy),
                                Math.cos(d)-Math.sin(cy)*Math.sin(lat2));
      pts.push([lon2*180/Math.PI,lat2*180/Math.PI]);
    }
    c2.beginPath();pg({type:'Feature',geometry:{type:'LineString',coordinates:pts}});c2.stroke();
  }
  const lbls=['N','30','60','E','120','150','S','210','240','W','300','330'];
  c2.fillStyle=`rgba(255,255,255,${(0.35*br).toFixed(3)})`;c2.font='9px sans-serif';
  c2.textAlign='center';c2.textBaseline='middle';
  lbls.forEach((lbl,i)=>{
    const brg=i*30*Math.PI/180;
    const d=Math.min(radiusKm*0.92,19500)/6371;
    const cx=CX*Math.PI/180,cy=CY*Math.PI/180;
    const lat2=Math.asin(Math.sin(cy)*Math.cos(d)+Math.cos(cy)*Math.sin(d)*Math.cos(brg));
    const lon2=cx+Math.atan2(Math.sin(brg)*Math.sin(d)*Math.cos(cy),
                              Math.cos(d)-Math.sin(cy)*Math.sin(lat2));
    const pt=proj([lon2*180/Math.PI,lat2*180/Math.PI]);
    if(pt&&pt[0]>8&&pt[0]<SZ-8&&pt[1]>8&&pt[1]<SZ-8)c2.fillText(lbl,pt[0],pt[1]);
  });
  c2.restore();
}

// ---- バンド別チャート --------------------------------------------------
// centerStep: 現在表示中のt_step, ±3時間分のステップ数を集計
function computeChartData(centerStep){
  // コンテスト全時間分のデータを構築する
  // totalSteps = コンテスト総ステップ数（24h=24, 48h=48）
  // 再生時はスクロールで表示ウィンドウ(±3h)を移動
  if(!allData)return null;
  const cfg=contestCfg();
  const resMin=allData.meta?.time_resolution_min??60;
  const stepsPerDay=allData.meta?.steps_per_day??24;
  const stepsPerHour=60/resMin;
  const halfSteps=Math.round(3*stepsPerHour); // 表示ウィンドウの半分（±3h）

  // コンテスト開始t_stepとコンテスト全ステップ数
  const contestStartStep=Math.round(cfg.startHour*60/resMin);
  const contestTotalSteps=cfg.hours*stepsPerHour; // 全ステップ（24or48）
  const totalSteps=Math.round(contestTotalSteps);

  const distKm=+document.getElementById('sld-lon').value;
  const lonDeg=distKm/111;
  const modeFilter=+document.getElementById('sel-mode').value;
  const powerMax=+document.getElementById('sel-power').value;

  const byBand={};
  for(let b=1;b<=6;b++){
    byBand[b]=Array.from({length:totalSteps},()=>({qso:0,grids:{},gc:0}));
  }

  for(let ci=0;ci<totalSteps;ci++){
    // 48hコンテスト: t_stepは0〜287で一意なのでcontest開始からの絶対ステップ
    // 24hコンテスト: 従来通り % stepsPerDay で折り返す
    const step=cfg.hours===48
      ? (contestStartStep+ci)
      : ((contestStartStep+ci)%stepsPerDay+stepsPerDay)%stepsPerDay;
    const recs=_stepIndex?_stepIndex[step]:[];
    if(!recs||!recs.length)continue;
    for(const rec of recs){
      const b=rec[1];
      if(b<1||b>6)continue;
      if(modeFilter&&rec[2]!==modeFilter)continue;
      if(powerMax>0&&rec[6]!=null&&rec[6]>0&&rec[6]>powerMax)continue;
      if(typeof rec[4]==='string'){
        const txMeta=allData.grids[rec[4]];
        if(!txMeta)continue;
        if(gcDist(QY,QX,txMeta.lat,txMeta.lon)>distKm)continue;
      } else {
        const lonMin=QX-lonDeg,lonMax=QX+lonDeg;
        if(rec[4]<lonMin||rec[4]>lonMax)continue;
      }
      byBand[b][ci].qso+=rec[5];
      if(!byBand[b][ci].grids[rec[0]]){byBand[b][ci].grids[rec[0]]=1;byBand[b][ci].gc++;}
    }
  }

  const result={};
  for(let b=1;b<=6;b++){
    result[b]=byBand[b].map(s=>({qso:s.qso,grids:s.gc}));
  }

  // contestStartStepのUTC時刻（分）
  const startUTCmin=cfg.startHour*60;
  // centerStepがコンテスト内の何ステップ目か
  // 48h: t_stepが0〜287で一意なので単純差分。24h: 従来通り折り返し
  const centerContestIdx=cfg.hours===48
    ? Math.max(0, centerStep-contestStartStep)
    : ((centerStep-contestStartStep)+stepsPerDay)%stepsPerDay;

  return{data:result, halfSteps, totalSteps, resMin, stepsPerHour,
         startUTCmin, contestStartStep, centerContestIdx, centerStep};
}

// ---- チャート背景キャッシュ -------------------------------------------
const _chartBg={};  // bgId -> キャッシュオブジェクト

function _buildChartBg(bgId, ovId, chartData, key, lineAlpha=1.0){
  const bg=document.getElementById(bgId);
  const ov=document.getElementById(ovId);
  if(!bg||!ov)return;

  const wrap=bg.parentElement;
  const LABEL_W=0; // バンドラベルはDOM要素で表示
  const W=Math.max(1,(wrap.offsetWidth||wrap.clientWidth));
  const H=Math.max(1,wrap.offsetHeight||Math.round(W*1.05));
  if(bg.width!==W||bg.height!==H){bg.width=W;bg.height=H;}
  if(ov.width!==W||ov.height!==H){ov.width=W;ov.height=H;}
  ov.style.left='0px';ov.style.top='0px';

  const {data,halfSteps,totalSteps,resMin,startUTCmin}=chartData;
  const PAD={l:34,r:4,t:20,b:32};
  const pw=W-PAD.l-PAD.r, ph=H-PAD.t-PAD.b;
  // 表示ウィンドウは±3時間(halfSteps*2+1ステップ)
  const winSteps=halfSteps*2+1;
  const pxPerStep=pw/(winSteps-1);

  // Y軸スケール: 全データから最大値
  let maxVal=1;
  for(let b=1;b<=6;b++)
    for(let i=0;i<totalSteps;i++) maxVal=Math.max(maxVal,data[b][i][key]);
  // nTicks=2〜5でyMaxが最小になる組み合わせを選択（同点は目盛り数優先）
  let yMax=Infinity,tickStep=1,nTicks=4;
  for(const n of [2,3,4,5]){
    const raw=maxVal/n;
    const m=raw>0?Math.pow(10,Math.floor(Math.log10(raw))):1;
    const ts=Math.ceil(raw/m)*m||1;
    const ym=ts*n;
    if(ym<yMax||(ym===yMax&&n>nTicks)){yMax=ym;tickStep=ts;nTicks=n;}
  }

  // 背景: Y軸グリッドとラベルのみ（静的）
  const ctx=bg.getContext('2d');
  ctx.fillStyle='#0a0f18';ctx.fillRect(0,0,W,H);
  ctx.lineWidth=0.5;ctx.font='9px sans-serif';ctx.textAlign='right';
  for(let i=0;i<=nTicks;i++){
    const v=tickStep*i,y=PAD.t+ph*(1-v/yMax);
    ctx.strokeStyle='rgba(255,255,255,0.06)';
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+pw,y);ctx.stroke();
    ctx.fillStyle='#99a';
    ctx.fillText(v>=1000?Math.round(v/1000)+'k':v,PAD.l-3,y+3);
  }

  const sumByStep=Array.from({length:totalSteps},(_,i)=>
    [1,2,3,4,5,6].reduce((s,b)=>s+data[b][i][key],0));

  const startContestIdx=chartData.centerContestIdx??0;
  _chartBg[bgId]={yMax,PAD,halfSteps,totalSteps,winSteps,pxPerStep,
                  W,H,LABEL_W,data,key,sumByStep,resMin,startUTCmin,startContestIdx,lineAlpha};
}

function _drawChartOverlay(bgId, ovId, elapsed){
  // elapsed: 再生開始からの経過ステップ数（小数）、非再生時は0
  const cache=_chartBg[bgId];
  const ov=document.getElementById(ovId);
  if(!cache||!ov)return;
  const {yMax,PAD,halfSteps,totalSteps,winSteps,pxPerStep,
         W,H,LABEL_W,data,key,sumByStep,resMin,startUTCmin,lineAlpha=1.0}=cache;
  const pw=W-PAD.l-PAD.r,ph=H-PAD.t-PAD.b;

  const ctx=ov.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // elapsedはコンテスト内インデックス（直接使用）
  const nowIdx=elapsed;

  // 破線はグラフ中央固定
  const nowX=PAD.l+pw/2;

  // クリップしてスクロール描画
  ctx.save();
  ctx.beginPath();ctx.rect(PAD.l,0,pw,H);ctx.clip();

  // i番目のデータポイントのX座標:
  // i=nowIdxのとき x=nowX（中央）
  // translateは使わず、X座標を直接計算
  const xOf=i=>nowX+(i-nowIdx)*pxPerStep;

  // 日照背景（先に描画=背面）
  {
    const p=Math.PI/180;
    for(let ci=0;ci<totalSteps;ci++){
      const x=xOf(ci);
      if(x<PAD.l-pxPerStep||x>PAD.l+pw+pxPerStep)continue;
      const utcMin5=((startUTCmin+ci*resMin)%(24*60)+24*60)%(24*60);
      const sol=solarPosition(utcMin5);
      const cosA=Math.sin(QY*p)*Math.sin(sol.lat*p)+
        Math.cos(QY*p)*Math.cos(sol.lat*p)*Math.cos((QX-sol.lon)*p);
      if(cosA>0){
        ctx.fillStyle='rgba(0,0,0,1)';
        ctx.fillRect(x-pxPerStep/2,PAD.t,Math.max(pxPerStep,1.5),ph);
      } else {
        ctx.fillStyle='rgba(5,10,40,0.65)';
        ctx.fillRect(x-pxPerStep/2,PAD.t,Math.max(pxPerStep,1.5),ph);
      }
      if(Math.abs(cosA)<0.03){
        const alpha=0.40*(1-Math.abs(cosA)/0.03);
        ctx.fillStyle=`rgba(220,130,40,${(alpha*0.7).toFixed(3)})`;
        ctx.fillRect(x-pxPerStep/2,PAD.t,Math.max(pxPerStep,1.5),ph);
      }
    }
  }

  // 時刻縦線（clip内）
  for(let ci=0;ci<totalSteps;ci++){
    const utcMin=(startUTCmin+ci*resMin)%(24*60);
    if(utcMin%60!==0)continue;
    const x=xOf(ci);
    if(x<PAD.l||x>PAD.l+pw)continue;
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,PAD.t+ph);ctx.stroke();
  }

  // 折れ線（日照背景より前面）
  for(let b=1;b<=6;b++){
    const vals=data[b].map(s=>s[key]);
    if(vals.every(v=>v===0))continue;
    ctx.strokeStyle=lineAlpha<1?bandColorAlpha(b,lineAlpha):BAND_COLORS[b];ctx.lineWidth=1.5;
    let inLine=false;
    ctx.beginPath();
    for(let i=0;i<totalSteps;i++){
      const x=xOf(i);
      if(x<PAD.l-10||x>PAD.l+pw+10){inLine=false;continue;} // 画面外スキップ
      const y=PAD.t+ph*(1-Math.min(vals[i],yMax)/yMax);
      inLine?ctx.lineTo(x,y):(ctx.moveTo(x,y),inLine=true);
    }
    ctx.stroke();
  }

  ctx.restore();

  // X軸ラベル（1時間ごとの絶対UTC時刻）- clip解除後に描画
  ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let ci=0;ci<totalSteps;ci++){
    const utcMin=(startUTCmin+ci*resMin)%(24*60);
    if(utcMin%60!==0)continue;
    const x=xOf(ci);
    if(x<PAD.l||x>PAD.l+pw)continue;
    const utcH=Math.floor(utcMin/60);
    ctx.fillStyle='#99a';
    ctx.fillText(String(utcH).padStart(2,'0')+'z',x,H-5);
  }

  // 破線（中央固定）
  ctx.strokeStyle='rgba(255,255,255,0.40)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(nowX,PAD.t);ctx.lineTo(nowX,PAD.t+ph);ctx.stroke();
  ctx.setLineDash([]);

  // 中心線の上にUTC時刻表示（QSOs グラフのみ）
  if(bgId==='bg-qsos'){
    const ci=Math.round(nowIdx);
    const clampedCi=Math.max(0,Math.min(totalSteps-1,ci));
    const utcMs=((startUTCmin+clampedCi*resMin)*60*1000);
    // RTモード中は実際のUTC秒も表示
    let timeStr;
    if(rtTimer){
      const now=new Date();
      const h=String(now.getUTCHours()).padStart(2,'0');
      const m=String(now.getUTCMinutes()).padStart(2,'0');
      const s=String(now.getUTCSeconds()).padStart(2,'0');
      timeStr=`${h}:${m}:${s}z`;
    } else {
      const totalMin=(startUTCmin+clampedCi*resMin)%(24*60);
      const h=String(Math.floor(totalMin/60)).padStart(2,'0');
      const mn=String(totalMin%60).padStart(2,'0');
      timeStr=`${h}:${mn}z`;
    }
    ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText(timeStr,nowX,1);
  }

  // バンドラベルをDOM要素で更新
  const _lblMap={'bg-qsos':'lbl-qsos','bg-grids':'lbl-grids','bg-rbn-spots':'lbl-rbn-spots','bg-rbn-grids':'lbl-rbn-grids'};
  const domLabelId=_lblMap[bgId];
  const domLabel=document.getElementById(domLabelId);
  if(domLabel){
    const rightIdx=Math.min(totalSteps-1,Math.round(nowIdx+halfSteps));
    let refIdx=rightIdx;
    while(refIdx>0&&sumByStep[refIdx]===0)refIdx--;
    const labelItems=[];
    for(let b=1;b<=6;b++){
      const vals=data[b].map(s=>s[key]);
      if(vals.every(v=>v===0))continue;
      const refVal=sumByStep[refIdx]>0?vals[refIdx]:0;
      const yRatio=(1-Math.min(refVal,yMax)/yMax);
      const yPct=(PAD.t+ph*yRatio)/H*100;
      labelItems.push({b,yPct});
    }
    labelItems.sort((a,b)=>a.yPct-b.yPct);
    const MIN_GAP_PCT=100*11/H;
    for(let i=1;i<labelItems.length;i++)
      if(labelItems[i].yPct-labelItems[i-1].yPct<MIN_GAP_PCT)
        labelItems[i].yPct=labelItems[i-1].yPct+MIN_GAP_PCT;
    for(let i=labelItems.length-2;i>=0;i--)
      if(labelItems[i+1].yPct-labelItems[i].yPct<MIN_GAP_PCT)
        labelItems[i].yPct=labelItems[i+1].yPct-MIN_GAP_PCT;
    domLabel.innerHTML=labelItems.map(({b,yPct})=>
      `<span class="band-label-item" style="top:${Math.max(2,Math.min(98,yPct)).toFixed(1)}%;color:${lineAlpha<1?bandColorAlpha(b,lineAlpha):BAND_COLORS[b]}">${BAND_NAMES[b]}</span>`
    ).join('');
  }
}

function drawChart(bgId, ovId, chartData, key, nowCI, lineAlpha=1.0){
  _buildChartBg(bgId, ovId, chartData, key, lineAlpha);
  _drawChartOverlay(bgId, ovId, (nowCI!==undefined&&nowCI!==null)?nowCI:(chartData?.centerContestIdx??0));
}


function computeRbnChartData(centerStep){
  if(!allRbnData||!_rbnStepIndex)return null;
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??10;
  const stepsPerDay=allData?.meta?.steps_per_day??144;
  const stepsPerHour=60/resMin;
  const halfSteps=Math.round(3*stepsPerHour);
  const contestStartStep=Math.round(cfg.startHour*60/resMin);
  const totalSteps=Math.round(cfg.hours*stepsPerHour);
  const distKm=+document.getElementById('sld-lon').value;
  const modeFilter=+document.getElementById('sel-mode').value;
  const powerMax=+document.getElementById('sel-power').value;

  const byBand={};
  for(let b=1;b<=6;b++)
    byBand[b]=Array.from({length:totalSteps},()=>({qso:0,grids:{},gc:0}));

  for(let ci=0;ci<totalSteps;ci++){
    const step=cfg.hours===48
      ?(contestStartStep+ci)
      :((contestStartStep+ci)%stepsPerDay+stepsPerDay)%stepsPerDay;
    const recs=_rbnStepIndex[step]||[];
    if(!recs.length)continue;
    for(const rec of recs){
      const b=rec[1];
      if(b<1||b>6)continue;
      if(modeFilter&&modeFilter!==1)continue;
      if(powerMax>0&&rec[6]!=null&&rec[6]>0&&rec[6]>powerMax)continue;
      const spottedGrid=allRbnData.grids[rec[0]]||allData?.grids[rec[0]];
      const spotterGrid=allRbnData.grids[rec[4]]||allData?.grids[rec[4]];
      // Cond1: spotted within dist → add spotter(rec[4])
      if(spottedGrid&&gcDist(QY,QX,spottedGrid.lat,spottedGrid.lon)<=distKm){
        if(spotterGrid){
          byBand[b][ci].qso+=rec[5];
          if(!byBand[b][ci].grids[rec[4]]){byBand[b][ci].grids[rec[4]]=1;byBand[b][ci].gc++;}
        }
      }
      // Cond2: spotter within dist → add spotted(rec[0])
      if(spotterGrid&&gcDist(QY,QX,spotterGrid.lat,spotterGrid.lon)<=distKm){
        if(spottedGrid){
          byBand[b][ci].qso+=rec[5];
          if(!byBand[b][ci].grids[rec[0]]){byBand[b][ci].grids[rec[0]]=1;byBand[b][ci].gc++;}
        }
      }
    }
  }

  const result={};
  for(let b=1;b<=6;b++)
    result[b]=byBand[b].map(s=>({qso:s.qso,grids:s.gc}));

  const startUTCmin=cfg.startHour*60;
  const centerContestIdx=cfg.hours===48
    ?Math.max(0,centerStep-contestStartStep)
    :((centerStep-contestStartStep)+stepsPerDay)%stepsPerDay;

  return{data:result,halfSteps,totalSteps,resMin,stepsPerHour,
         startUTCmin,contestStartStep,centerContestIdx,centerStep};
}

function _rbnChartsVisible(){
  return !!(document.getElementById('chk-rbn')?.checked&&allRbnData);
}

function updateCharts(floatOffset){
  const centerStep=getQueryStep();
  const chartData=computeChartData(centerStep);
  // 通常時(floatOffset未指定): centerContestIdxを使う
  // 再生時(floatOffset指定): その値をそのまま使う
  const nowCI=(floatOffset!==undefined&&floatOffset!==null)?floatOffset:(chartData.centerContestIdx??0);
  drawChart('bg-grids','ov-grids',chartData,'grids',nowCI);
  drawChart('bg-qsos', 'ov-qsos', chartData,'qso',  nowCI);
  if(_rbnChartsVisible()){
    const rcd=computeRbnChartData(centerStep);
    if(rcd){
      drawChart('bg-rbn-spots','ov-rbn-spots',rcd,'qso',   nowCI,0.7);
      drawChart('bg-rbn-grids','ov-rbn-grids',rcd,'grids', nowCI,0.7);
    }
  }
}

// ---- メイン描画 --------------------------------------------------------
function drawMap(skipBuildProj){
  if(!skipBuildProj)buildProj();
  const pg=d3.geoPath(proj,c2);
  const cx2=SZ/2,cy2=SZ/2,R=SZ/2-4;
  c2.clearRect(0,0,SZ,SZ);
  c2.save();
  c2.beginPath();c2.arc(cx2,cy2,R,0,Math.PI*2);c2.clip();
  c2.fillStyle='#000';c2.fillRect(0,0,SZ,SZ);

  const f=getFilters();
  const rxCount=queryHeatmap(f);
  const maxC=20;
  let visGrids=0,totalQSO=0;

  // 地形図・ベアリング・距離リングをオフスクリーンにキャッシュ
  // キャッシュキー: 中心・ズーム・サイズ・輝度が変わったときのみ再描画
  const bright=getBright();
  const distKmMap=+document.getElementById('sld-lon').value;
  const curStepKey=getQueryStep();
  const rtSecKey=rtTimer?Math.floor(Date.now()/1000):0; // RTモード中は秒単位で変化
  const panChecked=document.getElementById('chk-pan')?.checked?1:0;
  const offKey=`${CX.toFixed(4)},${CY.toFixed(4)},${radiusKm},${SZ},${bright.toFixed(2)},${distKmMap},${curStepKey},${rtSecKey},${viewS.toFixed(3)},${viewTX.toFixed(1)},${viewTY.toFixed(1)},${panChecked}`;
  if(!_offscreen||_offscreen.width!==SZ||_offscreen.height!==SZ){_offscreen=new OffscreenCanvas(SZ,SZ);_offscreenKey=null;}
  if(_offscreenKey!==offKey){
    const oc=_offscreen.getContext('2d');
    const opg=d3.geoPath(proj,oc);
    // グレイライン: strokeなし、fillの重ね塗りで昼夜境界を表現
    // アルゴリズム: 全面夜色 → dayCircle(92)薄オレンジ → dayCircle(91)濃オレンジ → dayCircle(90)黒(昼)
    {
      const resMin4=allData?.meta?.time_resolution_min??60;
      // RTモード中は実際のUTC分を使用、それ以外はt_stepから計算
      let utcMin4;
      if(rtTimer){
        const now4=new Date();
        utcMin4=now4.getUTCHours()*60+now4.getUTCMinutes();
      } else {
        utcMin4=(curStepKey*resMin4)%(24*60);
      }
      const sol=solarPosition(utcMin4);
      oc.save();
      oc.beginPath();oc.arc(SZ/2,SZ/2,SZ/2-4,0,Math.PI*2);oc.clip();
      // 全面: 黒（不透明確定）→ 夜色
      oc.fillStyle='#000';oc.fillRect(0,0,SZ,SZ);
      oc.fillStyle='rgba(5,10,40,0.68)';oc.fillRect(0,0,SZ,SZ);
      // dayCircleを大→小の順でfill（昼側の内側から外側に向かって塗り重ねる）
      const layers=[
        [92,'rgba(40,18,0,1)'],   // 境界外縁（極薄オレンジ）
        [91,'rgba(80,38,0,1)'],   // 境界本体（薄オレンジ）
        [90,'#000'],              // 昼側（黒）
      ];
      for(const[r,col]of layers){
        const gc=d3.geoCircle().center([sol.lon,sol.lat]).radius(r)();
        oc.fillStyle=col;
        oc.beginPath();opg(gc);oc.fill();
      }
      oc.restore();
    }

    // ベアリングライン
    oc.save();
    oc.beginPath();oc.arc(SZ/2,SZ/2,SZ/2-4,0,Math.PI*2);oc.clip();
    oc.strokeStyle=`rgba(255,255,255,${(0.18*bright).toFixed(3)})`;oc.lineWidth=0.6;
    for(let brg=0;brg<360;brg+=30){
      const bRad=brg*Math.PI/180,pts=[];
      for(let km=100;km<=20000;km+=200){
        const d=km/6371,cx=CX*Math.PI/180,cy=CY*Math.PI/180;
        const lat2=Math.asin(Math.sin(cy)*Math.cos(d)+Math.cos(cy)*Math.sin(d)*Math.cos(bRad));
        const lon2=cx+Math.atan2(Math.sin(bRad)*Math.sin(d)*Math.cos(cy),Math.cos(d)-Math.sin(cy)*Math.sin(lat2));
        pts.push([lon2*180/Math.PI,lat2*180/Math.PI]);
      }
      oc.beginPath();opg({type:'Feature',geometry:{type:'LineString',coordinates:pts}});oc.stroke();
    }
    // ベアリングラベル（Panモード時は非表示）
    if(!panChecked){
      const lbls=['N','30','60','E','120','150','S','210','240','W','300','330'];
      oc.fillStyle=`rgba(255,255,255,${(0.35*bright).toFixed(3)})`;oc.font='9px sans-serif';
      oc.textAlign='center';oc.textBaseline='middle';
      lbls.forEach((lbl,i)=>{
        const brg=i*30*Math.PI/180,d=Math.min(radiusKm*0.92,19500)/6371;
        const cx=CX*Math.PI/180,cy=CY*Math.PI/180;
        const lat2=Math.asin(Math.sin(cy)*Math.cos(d)+Math.cos(cy)*Math.sin(d)*Math.cos(brg));
        const lon2=cx+Math.atan2(Math.sin(brg)*Math.sin(d)*Math.cos(cy),Math.cos(d)-Math.sin(cy)*Math.sin(lat2));
        const pt=proj([lon2*180/Math.PI,lat2*180/Math.PI]);
        if(pt&&pt[0]>8&&pt[0]<SZ-8&&pt[1]>8&&pt[1]<SZ-8)oc.fillText(lbl,pt[0],pt[1]);
      });
    }
    // 地形図
    if(worldFeatures){
      oc.strokeStyle=`rgba(255,255,255,${(0.28*bright).toFixed(3)})`;oc.lineWidth=0.7;
      oc.beginPath();opg(worldFeatures);oc.stroke();
    }
    // 距離リング（Panモード時は非表示）
    if(!panChecked){
      const ringSteps=[200,500,1000,2000,5000,10000];
      const ringStep=ringSteps.find(s=>Math.floor(radiusKm/s)<=8)||10000;
      oc.setLineDash([3,5]);oc.strokeStyle=`rgba(255,220,80,${(0.30*bright).toFixed(3)})`;oc.lineWidth=0.8;
      for(let km=ringStep;km<=radiusKm;km+=ringStep){
        const deg=km/111.32;if(deg>=175)continue;
        oc.beginPath();opg(d3.geoCircle().center([CX,CY]).radius(deg)());oc.stroke();
        const lp=proj([CX,CY-deg+0.3]);
        if(lp&&lp[0]>8&&lp[0]<SZ-8&&lp[1]>8&&lp[1]<SZ-8){
          oc.setLineDash([]);
          oc.fillStyle=`rgba(255,220,80,${(0.55*bright).toFixed(3)})`;oc.font='8px sans-serif';oc.textAlign='left';
          oc.fillText(km.toLocaleString()+'km',lp[0]+3,lp[1]);
          oc.setLineDash([3,5]);
        }
      }
      oc.setLineDash([]);
      // Dist円（Panモード時は非表示）
      if(distKmMap>0&&distKmMap<=20000){
        const distDeg=distKmMap/111.32;
        if(distDeg<175){
          oc.beginPath();
          const opg2=d3.geoPath(proj,oc);
          opg2(d3.geoCircle().center([CX,CY]).radius(distDeg)());
          oc.strokeStyle=`rgba(100,200,255,${(0.7*bright).toFixed(3)})`;
          oc.lineWidth=1.2;
          oc.setLineDash([]);
          oc.stroke();
          const dp=proj([CX,CY-distDeg+0.3]);
          if(dp&&dp[0]>8&&dp[0]<SZ-8&&dp[1]>8&&dp[1]<SZ-8){
            oc.fillStyle=`rgba(100,200,255,${(0.85*bright).toFixed(3)})`;
            oc.font='9px sans-serif';oc.textAlign='left';
            oc.fillText(distKmMap.toLocaleString()+'km',dp[0]+3,dp[1]);
          }
        }
      }
    } else {
      oc.setLineDash([]);
    }
    oc.restore();
    _offscreenKey=offKey;
  }
  // キャッシュをメインcanvasに転送（高速）
  c2.drawImage(_offscreen,0,0);

  // ヒートマップセルをoffscreenの上に描画（点滅alpha適用）
  const cellEntries=[];
  _rxCountPerYear={};
  // RBNカウント: {rx4: count} — QSOと同一ロケータの場合QSOを優先
  const rbnCount=queryRbn(f);

  if(allData){
    const entries=Object.entries(rxCount).sort((a,b)=>a[1]-b[1]);
    c2.globalAlpha=_blinkAlpha;
    for(const[rx4,cnt]of entries){
      const meta=allData.grids[rx4];if(!meta)continue;
      const pt=proj([meta.lon,meta.lat]);if(!pt)continue;
      const dx=pt[0]-cx2,dy=pt[1]-cy2;
      if(dx*dx+dy*dy>(R+60)*(R+60))continue;
      const col=heatColor(cnt/maxC);if(!col)continue;
      c2.fillStyle=col;
      if(drawCell(meta.lat,meta.lon)){c2.fill();visGrids++;totalQSO+=cnt;cellEntries.push([rx4,cnt,col]);}
    }
    // RBNのみのセル（QSOがないロケータ）を描画
    if(document.getElementById('chk-rbn')?.checked&&allRbnData){
      const rbnEntries=Object.entries(rbnCount)
        .filter(([rx4])=>!(rx4 in rxCount))
        .sort((a,b)=>a[1]-b[1]);
      const maxRbn=10;
      for(const[rx4,cnt]of rbnEntries){
        const grids=allRbnData.grids[rx4]||allData.grids[rx4];
        if(!grids)continue;
        const pt=proj([grids.lon,grids.lat]);if(!pt)continue;
        const dx=pt[0]-cx2,dy=pt[1]-cy2;
        if(dx*dx+dy*dy>(R+60)*(R+60))continue;
        const col=rbnColor(cnt/maxRbn);if(!col)continue;
        c2.fillStyle=col;
        if(drawCell(grids.lat,grids.lon)){c2.fill();cellEntries.push([rx4,cnt,col,'rbn']);}
      }
    }
    c2.globalAlpha=1.0;
    // 年別QSO数集計（ツールチップ用）: _stepIndexから直接集計
    const f2=getFilters();
    const recs=_stepIndex?_stepIndex[f2.tStep]:allData.records;
    if(recs){
      for(const rec of recs){
        if(f2.band&&rec[1]!==f2.band)continue;
        if(f2.mode&&rec[2]!==f2.mode)continue;
        if(typeof rec[4]==='string'){
          const txMeta=allData.grids[rec[4]];
          if(!txMeta||gcDist(QY,QX,txMeta.lat,txMeta.lon)>f2.distKm)continue;
        }
        const rx4=rec[0],year=rec[7]??'?',cnt=rec[5];
        if(!_rxCountPerYear[rx4])_rxCountPerYear[rx4]={};
        _rxCountPerYear[rx4][year]=(_rxCountPerYear[rx4][year]||0)+cnt;
      }
    }
    // 点滅ループ用にキャッシュ保存
    // 圏外グリッド数 = Distフィルタ内の全グリッド数 - 地図上に描画できたグリッド数
    const totalFilteredGrids=Object.keys(rxCount).length;
    const offscreenGrids=Math.max(0,totalFilteredGrids-visGrids);
    // RBN圏外グリッド数
    const f_rbn=getFilters();
    const rbnCount_cache=queryRbn(f_rbn);
    const totalRbnGrids=Object.keys(rbnCount_cache).length;
    let visRbnGrids=0;
    {
      const mergedG=Object.assign({},allData.grids,allRbnData?.grids||{});
      for(const rx4 of Object.keys(rbnCount_cache)){
        const m=mergedG[rx4];if(!m)continue;
        if(gcDist(QY,QX,m.lat,m.lon)<=radiusKm)visRbnGrids++;
      }
    }
    const offscreenRbn=Math.max(0,totalRbnGrids-visRbnGrids);
    const rbnMaxC=10;
    _blinkCellCache={rxCount,maxC,cx2,cy2,R,entries:cellEntries,grids:allData.grids,offscreenGrids,
      rbnCount,rbnMaxC,offscreenRbn,
      rbnGrids:{...allRbnData?.grids||{},...allData.grids},
      rbnEnabled:document.getElementById('chk-rbn')?.checked};
  }

  // 圏外グリッド数表示更新
  const offG=_blinkCellCache?.offscreenGrids??0;
  const totalG=_blinkCellCache?Object.keys(_blinkCellCache.rxCount).length:0;
  const ovOff=document.getElementById('ov-offscreen');
  if(ovOff){
    const DC='rgba(100,200,255,0.85)'; // Dist円色
    const RED='#e44';
    const pct=totalG>0?(offG/totalG*100):0;
    const pctIsZero=(pct<0.05);
    const dLen=Math.max(1,String(totalG).length);
    const pLen2=5;
    const numStr=String(offG).padStart(dLen,' ');
    const denStr=String(totalG).padStart(dLen,' ');
    const pctStr=pct.toFixed(1).padStart(pLen2,' ');
    const numHtml=offG>0
      ? `<span class="blink" style="color:${RED}">${numStr}</span>`
      : `<span style="color:${DC}">${numStr}</span>`;
    const denomHtml=`<span style="color:${DC}">/${denStr}</span>`;
    const pctNumHtml=pctIsZero
      ? `<span style="color:${DC}">${pctStr}</span>`
      : `<span class="blink" style="color:${RED}">${pctStr}</span>`;
    const parenHtml=`<span style="color:${DC}"> (</span>${pctNumHtml}<span style="color:${DC}">%)</span>`;
    ovOff.innerHTML=`${numHtml}${denomHtml}${parenHtml}`;
    ovOff._blink=(offG>0||!pctIsZero);
  }

  c2.restore();

  c2.beginPath();c2.arc(cx2,cy2,R,0,Math.PI*2);
  c2.strokeStyle='rgba(255,255,255,0.20)';c2.lineWidth=1.5;c2.stroke();

  const _panActive=document.getElementById('chk-pan')?.checked&&(viewTX!==0||viewTY!==0||viewS!==1);
  if(!_panActive){
    const cp=proj([CX,CY]);
    if(cp){
      c2.globalAlpha=centerLabelAlpha;
      c2.beginPath();c2.arc(cp[0],cp[1],4,0,Math.PI*2);
      c2.fillStyle='#ee4444';c2.fill();
      c2.strokeStyle='#fff';c2.lineWidth=1.5;c2.stroke();
      c2.fillStyle='#fff';c2.font='bold 11px sans-serif';c2.textAlign='left';
      c2.fillText(document.getElementById('inp-grid').value.toUpperCase(),cp[0]+6,cp[1]+4);
      c2.globalAlpha=1.0;
    }
    if(!document.getElementById('chk-fixed').checked&&(Math.abs(QX-CX)>0.1||Math.abs(QY-CY)>0.1)){
      const qp=proj([QX,QY]);
      if(qp){c2.beginPath();c2.arc(qp[0],qp[1],4,0,Math.PI*2);
        c2.fillStyle='#4af';c2.fill();c2.strokeStyle='#fff';c2.lineWidth=1;c2.stroke();}
    }
  }

  c2.textAlign='center';c2.textBaseline='middle';
  c2.fillStyle='rgba(255,255,255,0.30)';c2.font='10px sans-serif';
  [[`N`,cx2,cy2-R+10],[`E`,cx2+R-8,cy2],[`S`,cx2,cy2+R-8],[`W`,cx2-R+8,cy2]]
    .forEach(([l,x,y])=>{if(x>=0&&x<=SZ&&y>=0&&y<=SZ)c2.fillText(l,x,y);});

  const rDisp=Math.round(radiusKm).toLocaleString()+'km';
  const fixed=document.getElementById('chk-fixed').checked;
  document.getElementById('ov-center').textContent=
    `Center: ${document.getElementById('inp-grid').value.toUpperCase()}`+
    (!fixed&&(Math.abs(QX-CX)>0.1||Math.abs(QY-CY)>0.1)?`  Query: ${geoToGrid4(QX,QY)}`:'');
  document.getElementById('ov-scale').textContent=`Radius: ${rDisp}`;
  document.getElementById('ov-info').textContent=`${visGrids} grids · ${totalQSO.toLocaleString()} QSOs`;

  // RBNパネル数表示更新
  {
    const rbnOn=document.getElementById('chk-rbn')?.checked&&allRbnData;
    const statEl=document.getElementById('ov-rbn-stat');
    const numsEl=document.getElementById('ov-rbn-nums');
    const pctEl =document.getElementById('ov-rbn-pct');
    if(statEl){
      if(!rbnOn){
        statEl.style.display='none';
        statEl._blink=false;
        const rbnInfoEl=document.getElementById('ov-rbn-info');
        if(rbnInfoEl) rbnInfoEl.style.display='none';
      } else {
        const f=getFilters();
        const rbnCount=queryRbn(f);
        const totalRbn=Object.keys(rbnCount).length;
        const mergedGrids=Object.assign({},allData?.grids,allRbnData.grids);
        let visRbn=0;
        for(const rx4 of Object.keys(rbnCount)){
          const meta=mergedGrids[rx4];if(!meta)continue;
          if(gcDist(QY,QX,meta.lat,meta.lon)<=radiusKm)visRbn++;
        }
        const hiddenRbn=totalRbn-visRbn;
        const pct=totalRbn>0?Math.round(hiddenRbn/totalRbn*100):0;
        const dLen=Math.max(1,String(totalRbn).length);
        const shouldBlink=(hiddenRbn>0);
        // 分子: 非表示数（hiddenRbn）
        if(numsEl){
          numsEl.textContent=String(hiddenRbn).padStart(dLen,' ');
          numsEl.className=shouldBlink?'blink':'';
        }
        const denEl=document.getElementById('ov-rbn-den');
        if(denEl) denEl.textContent=String(totalRbn).padStart(dLen,' ');
        if(pctEl){
          pctEl.textContent=String(pct).padStart(3,' ');
          pctEl.className=shouldBlink?'blink':'';
        }
        statEl._blink=shouldBlink;
        statEl.style.display='';

        // RBN grids・spots数表示
        const rbnInfoEl=document.getElementById('ov-rbn-info');
        if(rbnInfoEl){
          const rbnSpots=Object.values(rbnCount).reduce((s,v)=>s+v,0);
          rbnInfoEl.textContent=`${totalRbn} grids · ${rbnSpots.toLocaleString()} spots`;
          rbnInfoEl.style.display='';
        }
      }
    }
  }

  syncRadiusSlider();
  // radius-ctrlをoverlay-infoの直下に配置:
  //   radius-ctrl は bottom:8px 固定
  //   overlay-info は radius-ctrlの上 (bottom = 8 + rcHeight + 4)
  {
    const oi=document.getElementById('overlay-info');
    const rc=document.getElementById('radius-ctrl');
    if(oi&&rc){
      rc.style.bottom='8px';
      oi.style.bottom=(8+rc.offsetHeight+4)+'px';
    }
  }
  // 三角インジケーター描画
  drawOffscreenArrows(rxCount);
  updateBandModeDisplay();

  if(!_skipCharts)updateCharts();
}

// 最終週末判定: 今月の最後の土曜日
function lastSaturdayOfMonth(date){
  const d=new Date(date.getFullYear(),date.getMonth()+1,0); // 月末
  d.setDate(d.getDate()-((d.getDay()+1)%7)); // 直前の土曜
  return d;
}

function getRTStep(){
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??60;
  const stepsPerDay=allData?.meta?.steps_per_day??24;
  const now=new Date();
  const utcHour=now.getUTCHours();
  const utcMin=now.getUTCMinutes();
  const totalMin=utcHour*60+utcMin;
  const rawStep=Math.floor(totalMin/resMin);

  if(cfg.hours===24){
    // 24時間コンテスト: 現在UTC時刻をそのままステップに
    return rawStep % stepsPerDay;
  } else {
    // 48時間コンテスト: t_stepは0〜(stepsPerDay*2-1)で一意
    const lastSat=lastSaturdayOfMonth(now);
    const lastSun=new Date(lastSat); lastSun.setDate(lastSat.getDate()+1);
    const todayStr=now.toDateString();
    const isLastWeekend=(todayStr===lastSat.toDateString()||todayStr===lastSun.toDateString());

    let dayOffset=0;
    if(isLastWeekend){
      dayOffset=(todayStr===lastSun.toDateString())?1:0;
    } else {
      dayOffset=document.getElementById('chk-plus1d')?.checked?1:0;
    }
    // contest開始からの絶対分数 → t_step（折り返しなし）
    const contestMin=dayOffset*1440+totalMin-cfg.startHour*60;
    const s=Math.floor(contestMin/resMin);
    const maxStep=stepsPerDay*2-1;
    return Math.max(0,Math.min(maxStep,s));
  }
}

let _cycleTimer=null;
let _cycleIdx=0;
let _cycleSeq=[];   // [{band, mode}] のシーケンス
let _cycleFromCode=false; // プログラム変更フラグ（手動変更検知除外用）

// コンテストがモード固定かを返す: null=混在, 1=CW固定, 2=SSB固定
function contestFixedMode(){
  const k=document.getElementById('sel-contest').value;
  if(k==='cqww_cw'||k==='cqwpx_cw')return 1;
  if(k==='cqww_ssb'||k==='cqwpx_ssb')return 2;
  return null;
}

// コンテスト固有の制約をUIに反映
// CW固定: モードをCWに固定・選択不可
// SSB固定: モードをSSBに固定・選択不可、RBNを無効化（RBNはCWのみ）
// 混在: モード選択可能、RBN選択可能
function applyContestConstraints(){
  const fixedMode=contestFixedMode();
  const selMode=document.getElementById('sel-mode');
  const chkRbn=document.getElementById('chk-rbn');
  const lblRbn=chkRbn?.closest('label');
  const isSSB=(fixedMode===2);

  selMode.disabled=(fixedMode!==null);
  if(fixedMode!==null) selMode.value=fixedMode;

  if(chkRbn){
    if(isSSB){chkRbn.checked=false;chkRbn.disabled=true;}
    else{chkRbn.disabled=false;}
    if(lblRbn) lblRbn.style.opacity=isSSB?'0.4':'';
  }
  const chkRbnApprox=document.getElementById('chk-rbn-approx');
  const lblRbnApprox=chkRbnApprox?.closest('label');
  if(chkRbnApprox){
    if(isSSB){chkRbnApprox.checked=false;chkRbnApprox.disabled=true;}
    else{chkRbnApprox.disabled=false;}
    if(lblRbnApprox) lblRbnApprox.style.opacity=isSSB?'0.4':'';
  }
  updateBandModeDisplay();
}

// 全巡回シーケンス: 160m(1)→…→10m(6)、各バンドでAll→CW→SSBの順
// モード固定コンテストはモード巡回なし（固定モードのみ）
function buildAllCycleSeq(){
  const fixedMode=contestFixedMode();
  const bands=[1,2,3,4,5,6];
  const modes=fixedMode?[fixedMode]:[0,1,2]; // All=0, CW=1, SSB=2
  const seq=[];
  for(const b of bands) for(const m of modes) seq.push({band:b,mode:m});
  return seq;
}

// 自動巡回シーケンス: 現時間帯のQSO数降順、15%未満スキップ、モード扱いは全巡回と同
function buildAutoCycleSeq(){
  if(!allData||!_stepIndex)return buildAllCycleSeq();
  const fixedMode=contestFixedMode();
  const modes=fixedMode?[fixedMode]:[0,1,2];
  const f=getFilters(); // distKm・powerMax等を含む現在のフィルタ
  const tStep=f.tStep;
  // バンド別QSO数を集計（距離フィルタ・powerフィルタ適用、バンドはAll扱い）
  const bandQso={};
  for(const rec of (_stepIndex[tStep]||[])){
    // powerフィルタ
    if(f.powerMax>0&&rec[6]!=null&&rec[6]>0&&rec[6]>f.powerMax)continue;
    // 距離フィルタ
    if(typeof rec[4]==='string'){
      const txMeta=allData.grids[rec[4]];
      if(!txMeta)continue;
      if(gcDist(QY,QX,txMeta.lat,txMeta.lon)>f.distKm)continue;
    } else {
      if(rec[4]<QX-f.lonRange||rec[4]>QX+f.lonRange)continue;
    }
    const b=rec[1];
    bandQso[b]=(bandQso[b]||0)+rec[5];
  }
  const total=Object.values(bandQso).reduce((s,v)=>s+v,0);
  if(total===0)return buildAllCycleSeq();
  const threshold=total*0.15;
  // 閾値以上のバンドをQSO数降順にソート
  const sorted=Object.entries(bandQso)
    .filter(([,v])=>v>=threshold)
    .sort((a,b2)=>b2[1]-a[1])
    .map(([b])=>+b);
  if(sorted.length===0)return buildAllCycleSeq();
  const seq=[];
  for(const b of sorted) for(const m of modes) seq.push({band:b,mode:m});
  return seq;
}

function getCycleMode(){
  return document.querySelector('input[name="rt-cycle"]:checked')?.value??'none';
}

function getCycleInterval(){
  return +(document.querySelector('input[name="rt-crawl-timer"]:checked')?.value??5)*1000;
}

let _cycleCountdownRaf=null;
let _cycleNextAt=0; // 次の切り替え時刻(ms, performance.now基準)

function _updateCrawlCountdown(){
  const el=document.getElementById('crawl-countdown');
  if(!el)return;
  if(!_cycleTimer){el.textContent='';_cycleCountdownRaf=null;return;}
  const rem=Math.max(0,Math.ceil((_cycleNextAt-performance.now())/1000));
  el.textContent=rem+'s';
  _cycleCountdownRaf=requestAnimationFrame(_updateCrawlCountdown);
}

function applyCycleStep(){
  if(!_cycleSeq.length)return;
  _cycleIdx=_cycleIdx%_cycleSeq.length;
  const{band,mode}=_cycleSeq[_cycleIdx];
  _cycleFromCode=true;
  document.getElementById('sel-band').value=band;
  document.getElementById('sel-mode').value=mode;
  _cycleFromCode=false;
  updateBandModeDisplay();
  drawMap();
}

function startCycle(){
  stopCycle();
  const mode=getCycleMode();
  if(mode==='none')return;
  const intervalMs=getCycleInterval();
  _cycleSeq=mode==='all'?buildAllCycleSeq():buildAutoCycleSeq();
  _cycleIdx=0;
  applyCycleStep();
  _cycleNextAt=performance.now()+intervalMs;
  _cycleTimer=setInterval(()=>{
    if(getCycleMode()==='auto') _cycleSeq=buildAutoCycleSeq();
    _cycleIdx=(_cycleIdx+1)%_cycleSeq.length;
    applyCycleStep();
    _cycleNextAt=performance.now()+getCycleInterval();
  },intervalMs);
  // カウントダウン開始
  if(_cycleCountdownRaf){cancelAnimationFrame(_cycleCountdownRaf);_cycleCountdownRaf=null;}
  _cycleCountdownRaf=requestAnimationFrame(_updateCrawlCountdown);
}

function stopCycle(){
  if(_cycleTimer){clearInterval(_cycleTimer);_cycleTimer=null;}
  if(_cycleCountdownRaf){cancelAnimationFrame(_cycleCountdownRaf);_cycleCountdownRaf=null;}
  _cycleSeq=[];_cycleIdx=0;
  const el=document.getElementById('crawl-countdown');
  if(el)el.textContent='';
}

document.getElementById('btn-play').addEventListener('click',function(){

  stopAll();

  sld.max=totalStepsPlay-1;
  sld.style.width=(cfg_play.hours===48?'320px':'160px');
  const msPerStep=30000/stepsPerDay;
  let floatStep=+sld.value;
  let prevIntStep=-1;
  let lastTs=null;
  let cachedChartData={grids:null,qso:null};

  // 再生開始時刻を記録（floatStepを絶対時刻から計算）
  const playStartTs=performance.now();
  const playStartStep=floatStep;

  // キャッシュ
  let cachedHeatmap=null; // queryHeatmap結果
  let cachedMaxC=1;

  // 初回: buildProj + チャート背景を1回だけ構築（コンテスト全体を対象）
  buildProj();
  // チャートデータはコンテスト開始ステップ+3時間を中心に構築

  const cfg2=contestCfg();
  const resMinPlay=allData?.meta?.time_resolution_min??60;
  // initCenterStepはt_step（getQueryStepで正しく変換）
  const initCenterStep=getQueryStep();
  // floatStepもt_stepベースに変更
  floatStep=initCenterStep;
  const cd0=computeChartData(initCenterStep);
  const initContestIdx=cd0.centerContestIdx??0; // 再生ループで参照
  const contestTotalStepsPlay=cd0.totalSteps;   // 再生ループで参照
  {
    _buildChartBg('bg-grids','ov-grids',cd0,'grids');
    _buildChartBg('bg-qsos', 'ov-qsos', cd0,'qso');
    _drawChartOverlay('bg-grids','ov-grids',initContestIdx);
    _drawChartOverlay('bg-qsos', 'ov-qsos', initContestIdx);
    if(_rbnChartsVisible()){
      const rcd0=computeRbnChartData(initCenterStep);
      if(rcd0){
        _buildChartBg('bg-rbn-spots','ov-rbn-spots',rcd0,'qso',   0.7);
        _buildChartBg('bg-rbn-grids','ov-rbn-grids',rcd0,'grids', 0.7);

        _drawChartOverlay('bg-rbn-grids','ov-rbn-grids',initContestIdx);
      }
    }
    sld.value=initCenterStep;
    updateInpHour(initCenterStep);
    _skipCharts=true; drawMap(true); _skipCharts=false;
  }

  let chartUpdatePending=false;

  function rafStep(ts){
    floatStep=playStartStep+(ts-playStartTs)/msPerStep;
    // 終了はnowCI>=contestTotalStepsPlayで判定するためここでは不要

    // 48h: intStepは0〜287で一意（折り返しなし）、24h: 従来通り折り返し
    const totalStepsPlay=cfg_play.hours===48?stepsPerDay*2:stepsPerDay;
    const intStep=Math.min(totalStepsPlay-1, Math.floor(floatStep));

    // 整数ステップ変化時: ヒートマップ更新（チャートは再構築しない）
    if(intStep!==prevIntStep){
      prevIntStep=intStep;
      sld.value=intStep;
      updateInpHour(intStep);
      if(!chartUpdatePending){
        chartUpdatePending=true;
        // ヒートマップを次フレームに分散
        requestAnimationFrame(()=>{
          _skipCharts=true; drawMap(true); _skipCharts=false;
          chartUpdatePending=false;
        });
      }
    }

    // nowCI: 現在のコンテスト内インデックス（小数）
    // initCIは再生開始時に計算済み（initContestIdx）
    const nowCI=initContestIdx+(floatStep-playStartStep);
    // コンテスト終了チェック
    if(nowCI>=contestTotalStepsPlay){stopAll();drawMap();return;}
    _drawChartOverlay('bg-grids','ov-grids',nowCI);
    _drawChartOverlay('bg-qsos', 'ov-qsos', nowCI);
    if(_rbnChartsVisible()){
      _drawChartOverlay('bg-rbn-spots','ov-rbn-spots',nowCI);
      _drawChartOverlay('bg-rbn-grids','ov-rbn-grids',nowCI);
    }

    animTimer=requestAnimationFrame(rafStep);
  }
  animTimer=requestAnimationFrame(rafStep);
});

document.getElementById('btn-rtplay').addEventListener('click',function(){
  if(this.textContent.includes('Stop')){stopAll();drawMap();return;}
  // AudioContext サイレントループ: OS に「音声再生中」と認識させ App Nap を防ぐ
  if(!window._kaCtx){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        window._kaCtx=new AC();
        const buf=window._kaCtx.createBuffer(1,window._kaCtx.sampleRate,window._kaCtx.sampleRate);
        const src=window._kaCtx.createBufferSource();
        src.buffer=buf; src.loop=true;
        src.connect(window._kaCtx.destination);
        src.start(0);
      }
    }catch(e){}
  }
  stopAll();
  this.textContent='■ Stop'; this.dataset.tip=t('rt_stop');
  this.classList.add('btn-running-rt');
  document.getElementById('btn-play').disabled=true;
  // スライダーをグレーアウト
  document.getElementById('sld-hour').disabled=true;
  document.getElementById('sld-hour').style.opacity='0.3';
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??60;
  const stepsPerDay=allData?.meta?.steps_per_day??24;

  // 48時間コンテストで最終週末でない場合はDay選択を表示
  if(cfg.hours===48){
    const now=new Date();
    const lastSat=lastSaturdayOfMonth(now);
    const lastSun=new Date(lastSat); lastSun.setDate(lastSat.getDate()+1);
    const todayStr=now.toDateString();
    const isLastWeekend=(todayStr===lastSat.toDateString()||todayStr===lastSun.toDateString());
    if(!isLastWeekend){
      document.getElementById('rtplay-day')?.remove();
    }
  }

  function tick(){
    const tStep=getRTStep();
    const cfg2=contestCfg();
    const resMin2=allData?.meta?.time_resolution_min??60;
    const stepsPerDay2=allData?.meta?.steps_per_day??24;
    const startStep=Math.round(cfg2.startHour*60/resMin2);
    // 48h: tStepは0〜287で一意。sld.valueもそのまま（sld.max=287）
    // 24h: 従来通り折り返し
    const sldVal=cfg2.hours===48
      ? Math.max(0, tStep-startStep)
      : ((tStep-startStep)+stepsPerDay2)%stepsPerDay2;
    const sld=document.getElementById('sld-hour');
    sld.value=sldVal;
    updateInpHour(sldVal);
    drawMap();
  }
  tick();
  // 次の10分境界まで待ってからsetInterval（10分毎にtick）
  {
    const now0=new Date();
    const msToNext=(600-now0.getUTCSeconds()%600)*1000-now0.getUTCMilliseconds();
    rtTimer=setTimeout(()=>{
      if(!rtTimer)return;
      tick();
      rtTimer=setInterval(tick, 600*1000);
    }, Math.max(100,msToNext));
  }
  // バンド巡回開始
  startCycle();

  // setIntervalで毎フレーム更新（グラフ連続スクロール＋5秒毎地図更新）
  let _rtLastSec=-1;
  function rtTick(){
    const cfg3=contestCfg();
    const resMin3=allData?.meta?.time_resolution_min??60;
    const stepsPerDay3=allData?.meta?.steps_per_day??24;
    const startStep3=Math.round(cfg3.startHour*60/resMin3);
    const tStep3=getRTStep();
    const now3=new Date();
    const secInStep=(now3.getUTCMinutes()%resMin3*60+now3.getUTCSeconds())/(resMin3*60);
    const nowCI=cfg3.hours===48
      ? Math.max(0, tStep3-startStep3)+secInStep
      : ((tStep3-startStep3)+stepsPerDay3)%stepsPerDay3+secInStep;
    if(_chartBg['bg-qsos']) _chartBg['bg-qsos'].startContestIdx=nowCI;
    if(_chartBg['bg-grids']) _chartBg['bg-grids'].startContestIdx=nowCI;
    if(_chartBg['bg-rbn-spots']) _chartBg['bg-rbn-spots'].startContestIdx=nowCI;
    if(_chartBg['bg-rbn-grids']) _chartBg['bg-rbn-grids'].startContestIdx=nowCI;
    _drawChartOverlay('bg-qsos','ov-qsos',nowCI);
    _drawChartOverlay('bg-grids','ov-grids',nowCI);
    if(_rbnChartsVisible()){
      _drawChartOverlay('bg-rbn-spots','ov-rbn-spots',nowCI);
      _drawChartOverlay('bg-rbn-grids','ov-rbn-grids',nowCI);
    }
    const curSec=Math.floor(now3.getUTCSeconds()/5);
    if(curSec!==_rtLastSec){
      _rtLastSec=curSec;
      setTimeout(()=>{_skipCharts=true;drawMap(true);_skipCharts=false;},0);
    }
  }
  _rtRafId=setInterval(rtTick,16);
});

function parseGrid(g){
  g=g.toUpperCase().trim();if(g.length<4)return null;
  const lon=(g.charCodeAt(0)-65)*20-180+parseInt(g[2])*2+1;
  const lat=(g.charCodeAt(1)-65)*10-90+parseInt(g[3])*1+0.5;
  return isNaN(lon)||isNaN(lat)?null:[lat,lon];
}

function _applyInpHour(){
  const inp=document.getElementById('inp-hour');
  const cfg=contestCfg();
  const resMin=allData?.meta?.time_resolution_min??60;
  const stepsPerDay=allData?.meta?.steps_per_day??24;
  const startStep=Math.round(cfg.startHour*60/resMin);
  // HH:MM をパース
  const m=inp.value.match(/^(\d{1,2}):(\d{2})$/);
  if(!m){ updateInpHour(+document.getElementById('sld-hour').value); return; }
  let hh=parseInt(m[1],10);
  let mm=Math.floor(parseInt(m[2],10)/10)*10; // 10分単位に丸め
  // 48時間コンテスト: +1dチェックで+24h
  if(cfg.hours===48){
    const chk=document.getElementById('chk-plus1d');
    if(chk&&chk.checked) hh+=24;
  }
  const totalMin=hh*60+mm;
  const step=Math.round(totalMin/resMin)-startStep;
  const maxStep=cfg.hours===48?stepsPerDay*2-1:stepsPerDay-1;
  const clamp=Math.max(0,Math.min(maxStep,step));
  document.getElementById('sld-hour').value=clamp;
  updateInpHour(clamp);
  requestAnimationFrame(()=>drawMap());
}

      clearTimeout(_tipTimer);
      _tipTimer=setTimeout(()=>{
        const type=elOv.dataset.tipOv;
        let html='';
        if(type==='qso'&&_blinkCellCache){
          const offG=_blinkCellCache.offscreenGrids??0;
          const totalG=Object.keys(_blinkCellCache.rxCount||{}).length;
          const pct=totalG>0?(offG/totalG*100).toFixed(1):0;
          html=isJa

        } else if(type==='rbn'&&_blinkCellCache){

          const totalRbn=Object.keys(rbnCount).length;
          const visRbn=totalRbn-(_blinkCellCache.offscreenRbn??0);
          const pct=totalRbn>0?((totalRbn-visRbn)/totalRbn*100).toFixed(1):0;
          html=isJa
            ?`未表示RBNロケータ: ${totalRbn-visRbn}/${totalRbn} (${pct}%)<br><span style="color:#888;font-size:10px;">クリックで表示範囲をデフォルトに戻す</span>`
            :`Off-screen RBN grids: ${totalRbn-visRbn}/${totalRbn} (${pct}%)<br><span style="color:#888;font-size:10px;">Click to reset view</span>`;
        }
        if(html){tip.innerHTML=html;placeTip(e,elOv);resetHideTimer();}
      },300);
      return;
    }
    const el=e.target.closest('[data-tip]');
    if(!el){tip.style.display='none';clearTimeout(_tipHideTimer);return;}
    clearTimeout(_tipTimer);
    _tipTimer=setTimeout(()=>{
      tip.textContent=el.dataset.tip;
      placeTip(e,el);
      resetHideTimer();
    },300);
  });
  document.addEventListener('mousemove',e=>{
    if(tip.style.display==='none')return;
    const el=e.target.closest('[data-tip],[data-tip-ov]');
    if(!el)return;
    placeTip(e,el);
    resetHideTimer();
  });
  document.addEventListener('mouseout',e=>{
    if(!e.target.closest('[data-tip],[data-tip-ov]'))return;
    clearTimeout(_tipTimer);
    clearTimeout(_tipHideTimer);
    tip.style.display='none';
  });
}

// ---- 圏外三角インジケーター -------------------------------------------
// 三角点滅用（全体blinkとは独立）

// グリッドが大圏地図の「外側」かどうか判定
// 外側: projで円の外、またはパネルの1/5以下しか見えていない
function isGridOffscreen(meta){
  const pt=proj([meta.lon,meta.lat]);
  if(!pt)return true; // 投影不可=完全圏外
  const cx2=SZ/2,cy2=SZ/2,R=SZ/2-4;
  const dx=pt[0]-cx2,dy=pt[1]-cy2;
  const distFromCenter=Math.sqrt(dx*dx+dy*dy);
  if(distFromCenter<=R*0.9)return false; // 明らかに内側

  // パネルの4隅のうち何割が円内か判定（1/5=20%以下なら外側）
  const pe=proj([meta.lon+2,meta.lat]);
  const pn=proj([meta.lon,meta.lat+1]);
  if(!pe||!pn)return true;
  const eX=(pe[0]-pt[0])/2,eY=(pe[1]-pt[1])/2;
  const nX=(pn[0]-pt[0])/2,nY=(pn[1]-pt[1])/2;
  const corners=[
    [pt[0]-eX-nX,pt[1]-eY-nY],[pt[0]+eX-nX,pt[1]+eY-nY],
    [pt[0]+eX+nX,pt[1]+eY+nY],[pt[0]-eX+nX,pt[1]-eY+nY]
  ];
  const inside=corners.filter(([x,y])=>{
    const ddx=x-cx2,ddy=y-cy2;return ddx*ddx+ddy*ddy<=R*R;
  }).length;
  return inside<=1; // 4隅のうち1個以下(≦25%<1/5相当)が円内なら外側
}

// 方位角計算（中心から対象グリッドへ、度数法0〜360）
function bearingTo(lat,lon){
  const cx=CX*Math.PI/180,cy=CY*Math.PI/180;
  const tx=lon*Math.PI/180,ty=lat*Math.PI/180;
  const dlon=tx-cx;
  const y=Math.sin(dlon)*Math.cos(ty);
  const x=Math.cos(cy)*Math.sin(ty)-Math.sin(cy)*Math.cos(ty)*Math.cos(dlon);
  return((Math.atan2(y,x)*180/Math.PI)+360)%360;
}

// 外周からグリッドまでの距離からサイズ段階(0〜6、0=最大)を取得
const ARROW_DIST_STEPS=[500,1000,2000,5000,10000,15000,20000];
function distToSizeIdx(km){
  for(let i=0;i<ARROW_DIST_STEPS.length;i++){
    if(km<=ARROW_DIST_STEPS[i])return i;
  }
  return ARROW_DIST_STEPS.length-1;
}
// サイズ段階→実際の三角サイズ（px）：大きいほど大きい
const ARROW_SIZES=[18,15,13,10,8,6,5]; // index0=最大(500km以内)

// 三角を1個描画（頂点が外向き）
function drawOneArrow(ctx,brgDeg,distFromEdgePx,sizePx,alpha){
  const cx2=SZ/2,cy2=SZ/2,R=SZ/2-4;
  const MARGIN=20; // 外周から内側へのマージン(px)
  const brgRad=brgDeg*Math.PI/180;
  // 配置中心: 外周からMARGIN内側
  const px=cx2+(R-MARGIN)*Math.sin(brgRad);
  const py=cy2-(R-MARGIN)*Math.cos(brgRad);
  // 三角: 頂点が外向き（brgRad方向）、底辺が内側
  const tip=sizePx;
  const half=sizePx*0.55;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(brgRad); // 頂点が外向き
  ctx.globalAlpha=alpha;
  ctx.beginPath();
  ctx.moveTo(tip,0);          // 先端（外側）
  ctx.lineTo(-tip,-half);     // 底辺左
  ctx.lineTo(-tip, half);     // 底辺右
  ctx.closePath();
  ctx.strokeStyle='#fff';
  ctx.lineWidth=1.2;
  ctx.stroke();
  ctx.restore();
}

// キャッシュ: 前回の三角データ

function drawOffscreenArrows(rxCount){
  if(!allData||!proj)return;

  // QSO圏外グリッドを方位角10°グループに集約
  const groups={}; // key=10度単位の方位角スロット
  if(rxCount){
    for(const[rx4,qsoCount]of Object.entries(rxCount)){
      const meta=allData.grids[rx4];if(!meta)continue;
      if(!isGridOffscreen(meta))continue;
      const brg=bearingTo(meta.lat,meta.lon);
      const slot=Math.floor(brg/10)*10;
      const distKm=gcDist(CY,CX,meta.lat,meta.lon);
      if(!groups[slot])groups[slot]={totalQso:0,sizeQso:{}};
      groups[slot].totalQso+=qsoCount;
      const si=distToSizeIdx(distKm);
      groups[slot].sizeQso[si]=(groups[slot].sizeQso[si]||0)+qsoCount;
    }
  }

  // RBN圏外グリッドを方位角10°グループに集約（QSOとは別管理）
  const rbnGroups={};
  if(allRbnData&&document.getElementById('chk-rbn')?.checked){
    const f=getFilters();
    const rbnCount=queryRbn(f);
    for(const[rx4,rbnCnt]of Object.entries(rbnCount)){
      const meta=allRbnData.grids[rx4]||allData.grids[rx4];if(!meta)continue;
      if(!isGridOffscreen(meta))continue;
      const brg=bearingTo(meta.lat,meta.lon);
      const slot=Math.floor(brg/10)*10;
      const distKm=gcDist(CY,CX,meta.lat,meta.lon);
      if(!rbnGroups[slot])rbnGroups[slot]={totalQso:0,sizeQso:{}};
      rbnGroups[slot].totalQso+=rbnCnt;
      const si=distToSizeIdx(distKm);
      rbnGroups[slot].sizeQso[si]=(rbnGroups[slot].sizeQso[si]||0)+rbnCnt;
    }
  }

  // 三角リストを構築
  // QSO: 外側リング、RBN: 内側リング
  // offsetの代わりにdistPx（外周からの内向きpx距離）で管理し重なりを防ぐ
  const RBN_GAP=20;  // QSO群とRBN群の間隔(px)
  const arrows=[];

  // QSO三角を構築し、方位角スロットごとの使用済みpx幅を記録
  const qsoUsedPx={};  // slot → QSOが使った内向き距離(px)
  function buildQsoArrows(grps){
    for(const[slotStr,g]of Object.entries(grps)){
      const brgDeg=+slotStr+5;
      const sizeEntries=Object.entries(g.sizeQso)
        .map(([si,q])=>({si:+si,q}))
        .sort((a,b)=>a.si-b.si);
      let usedPx=0;
      for(const{si,q}of sizeEntries){
        const sizePx=ARROW_SIZES[Math.min(si,ARROW_SIZES.length-1)];
        const step=sizePx*1.2;
        const n=Math.min(10,Math.floor(Math.log2(q))+1);
        for(let k=0;k<n;k++){
          arrows.push({brgDeg,sizeIdx:si,distPx:usedPx,color:'rgba(255,255,255,0.9)',isRbn:false});
          usedPx+=step;
        }
      }
      qsoUsedPx[slotStr]=usedPx;
    }
  }

  // RBN三角を構築（QSO使用px + GAP の位置から開始）
  function buildRbnArrows(grps){
    for(const[slotStr,g]of Object.entries(grps)){
      const brgDeg=+slotStr+5;
      const sizeEntries=Object.entries(g.sizeQso)
        .map(([si,q])=>({si:+si,q}))
        .sort((a,b)=>a.si-b.si);
      // QSOがある方位スロットはその内側+GAP、ない場合はQSOと同じ外周端から
      const qsoUsed=qsoUsedPx[slotStr];
      const startPx=qsoUsed!=null ? qsoUsed+RBN_GAP : 0;
      let usedPx=startPx;
      for(const{si,q}of sizeEntries){
        const sizePx=ARROW_SIZES[Math.min(si,ARROW_SIZES.length-1)];
        const step=sizePx*1.2;
        const n=Math.min(10,Math.floor(Math.log2(q))+1);
        for(let k=0;k<n;k++){
          arrows.push({brgDeg,sizeIdx:si,distPx:usedPx,color:'rgba(220,0,220,0.9)',isRbn:true});
          usedPx+=step;
        }
      }
    }
  }

  buildQsoArrows(groups);
  buildRbnArrows(rbnGroups);

  _arrowCache=arrows;
  _startArrowBlink(arrows);
}

function _startArrowBlink(arrows){
  const gen=++_arrowBlink.gen;
  if(_arrowBlink.raf){cancelAnimationFrame(_arrowBlink.raf);_arrowBlink.raf=null;}
  if(!arrows||arrows.length===0)return;

  // 各三角のalphaを独立管理
  const N=arrows.length;
  const alphas=new Float32Array(N).fill(1.0);
  const phases=new Float32Array(N); // 0〜1の位相オフセット
  const DELAY=200; // ms遅延間隔
  const PERIOD=1200; // 1周期ms
  const startTs=performance.now();
  // distPx=0(外側)が最初、distPxが大きい(内側)ほど遅延
  for(let i=0;i<N;i++) phases[i]=(Math.round(arrows[i].distPx/10)*DELAY)%PERIOD/PERIOD;

  function loop(ts){
    if(_arrowBlink.gen!==gen)return;
    const elapsed=(ts-startTs)/PERIOD;
    for(let i=0;i<N;i++){
      const phase=((elapsed+phases[i])%1+1)%1;
      alphas[i]=0.15+0.85*((1-Math.cos(phase*Math.PI*2))/2);
    }
    _arrowBlink.alphas=alphas; // _redrawCellsOnlyから参照できるよう保存
    const _panActiveArrow=document.getElementById('chk-pan')?.checked&&(viewTX!==0||viewTY!==0||viewS!==1);
    if(!_panActiveArrow)_drawArrowsOnCanvas(arrows,alphas);
    _arrowBlink.raf=requestAnimationFrame(loop);
  }
  _arrowBlink.raf=requestAnimationFrame(loop);
}

function _drawArrowsOnCanvas(arrows,alphas){
  if(!arrows||arrows.length===0)return;
  const cx2=SZ/2,cy2=SZ/2,R=SZ/2-4;
  c2.save();
  c2.beginPath();c2.arc(cx2,cy2,R,0,Math.PI*2);c2.clip();
  for(let i=0;i<arrows.length;i++){
    const{brgDeg,sizeIdx,distPx,color}=arrows[i];
    const sizePx=ARROW_SIZES[Math.min(sizeIdx,ARROW_SIZES.length-1)]*viewS;
    const brgRad=brgDeg*Math.PI/180;
    const EDGE=18*viewS;
    const dist=R-EDGE-distPx*viewS;
    if(dist<10)continue;
    const px2=cx2+dist*Math.sin(brgRad);
    const py2=cy2-dist*Math.cos(brgRad);
    const tip=sizePx,half=sizePx*0.55;
    c2.save();
    c2.translate(px2,py2);
    c2.rotate(brgRad);
    c2.globalAlpha=alphas?alphas[i]:0.8;
    c2.beginPath();
    c2.moveTo(0,-tip);
    c2.lineTo(-half,tip);
    c2.lineTo(half,tip);
    c2.closePath();
    c2.strokeStyle=color||'rgba(255,255,255,0.9)';
    c2.lineWidth=1.2;
    c2.stroke();
    c2.restore();
  }
  c2.restore();
}
