// ---- ロケータホバーツールチップ ------------------------------------------
// rxCountPerYear: {rx4: {year: count, ...}, ...} — drawMapで更新
let _rxCountPerYear={};
let _hoverTooltipTimeout=null;

cv.addEventListener('mousemove',e=>{
  if(isDragging)return;
  const rect=cv.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(SZ/rect.width);
  const py=(e.clientY-rect.top)*(SZ/rect.height);
  const tip=document.getElementById('grid-tooltip');

  if(!_blinkCellCache||!allData){tip.style.display='none';return;}
  const{grids,entries}=_blinkCellCache;

  // セルヒット判定ヘルパー
  function hitTest(meta){
    const pt=proj([meta.lon,meta.lat]);if(!pt)return false;
    const pe=proj([meta.lon+2,meta.lat]);
    const pn=proj([meta.lon,meta.lat+1]);
    if(!pe||!pn)return false;
    const szX=Math.abs(pe[0]-pt[0]);
    const szY=Math.abs(pn[1]-pt[1]);
    return Math.abs(px-pt[0])<szX&&Math.abs(py-pt[1])<szY;
  }

  let found=null;
  let foundIsRbnOnly=false;

  // QSOパネルを検索（最前面優先）
  for(const[rx4]of [...entries].reverse()){
    const meta=grids[rx4];if(!meta)continue;
    if(hitTest(meta)){found=rx4;break;}
  }

  // QSOパネルにヒットしなかった場合、RBN専用パネルを検索
  if(!found&&_blinkCellCache.rbnEnabled&&_blinkCellCache.rbnCount){
    const{rbnCount,rbnGrids}=_blinkCellCache;
    const mergedRbnGrids=Object.assign({},grids,rbnGrids);
    for(const rx4 of Object.keys(rbnCount)){
      if(rx4 in (_blinkCellCache.rxCount||{}))continue; // QSOパネルは除外済み
      const meta=mergedRbnGrids[rx4];if(!meta)continue;
      if(hitTest(meta)){found=rx4;foundIsRbnOnly=true;break;}
    }
  }

  if(!found){tip.style.display='none';return;}

  // ツールチップ内容構築: グリッド名 + 年別QSO数 + RBN数
  const yearData=_rxCountPerYear[found]||{};
  const years=Object.keys(yearData).sort();
  let html=`<b>${found}</b>`;
  if(years.length>0){
    html+='<br>'+years.map(y=>`${y}: ${yearData[y]} QSO`).join('<br>');
  }
  // RBN数（RBNデータがある場合）
  if(allRbnData&&document.getElementById('chk-rbn')?.checked){
    const f=getFilters();
    const rbnC=queryRbn(f);
    const rbnN=rbnC[found];
    if(rbnN) html+=`<br><span style="color:#cc44cc">RBN: ${rbnN}</span>`;
  }
  tip.innerHTML=html;
  tip.style.display='block';
  const mapRect=cv.parentElement.getBoundingClientRect();
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const mw=mapRect.width,   mh=mapRect.height;
  const cx=e.clientX-mapRect.left, cy=e.clientY-mapRect.top;
  let tx=cx+12, ty=cy-10;
  if(tx+tw>mw-4) tx=cx-tw-12;   // 右はみ出し→左反転
  if(ty+th>mh-4) ty=cy-th-10;   // 下はみ出し→上反転
  if(tx<4) tx=4;
  if(ty<4) ty=4;
  tip.style.left=tx+'px';
  tip.style.top=ty+'px';
});
cv.addEventListener('mouseleave',()=>{
  document.getElementById('grid-tooltip').style.display='none';
});

// cvクリック: 三角インジケーターをクリックしたらその方向のパネルが見えるよう縮小
cv.addEventListener('click',e=>{
  if(isDragging)return;
  const rect=cv.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(SZ/rect.width);
  const py=(e.clientY-rect.top)*(SZ/rect.height);
  const cx2=SZ/2,cy2=SZ/2;

  if(!_arrowCache||_arrowCache.length===0)return;
  for(const arrow of _arrowCache){
    const{brgDeg,sizeIdx,distPx}=arrow;
    const sizePx=ARROW_SIZES[Math.min(sizeIdx,ARROW_SIZES.length-1)]*viewS;
    const brgRad=brgDeg*Math.PI/180;
    const EDGE=18*viewS;
    const dist=(SZ/2-4)-EDGE-distPx*viewS;
    if(dist<10)continue;
    const ax=cx2+dist*Math.sin(brgRad);
    const ay=cy2-dist*Math.cos(brgRad);
    const hitR=sizePx*1.4;
    if((px-ax)**2+(py-ay)**2<=hitR*hitR){
      const isRbn=arrow.isRbn===true;
      _zoomToArrowDirection(brgDeg, isRbn);
      return;
    }
  }
});

function _zoomToArrowDirection(brgDeg, isRbn=false){
  if(!allData||!_arrowCache)return;
  const f=getFilters();
  let maxDist=0;

  if(isRbn&&allRbnData){
    // RBN三角: queryRbnの結果から圏外グリッドの最遠を探す
    const rbnCount=queryRbn(f);
    for(const[rx4]of Object.entries(rbnCount)){
      const meta=allRbnData.grids[rx4]||allData.grids[rx4];if(!meta)continue;
      if(!isGridOffscreen(meta))continue;
      const brg=bearingTo(meta.lat,meta.lon);
      let diff=((brg-brgDeg)+360)%360;
      if(diff>180)diff=360-diff;
      if(diff>15)continue;
      const d=gcDist(CY,CX,meta.lat,meta.lon);
      if(d>maxDist)maxDist=d;
    }
  } else {
    // QSO三角: queryHeatmapの結果から圏外グリッドの最遠を探す
    const rxCount=queryHeatmap(f);
    for(const[rx4]of Object.entries(rxCount)){
      const meta=allData.grids[rx4];if(!meta)continue;
      if(!isGridOffscreen(meta))continue;
      const brg=bearingTo(meta.lat,meta.lon);
      let diff=((brg-brgDeg)+360)%360;
      if(diff>180)diff=360-diff;
      if(diff>15)continue;
      const d=gcDist(CY,CX,meta.lat,meta.lon);
      if(d>maxDist)maxDist=d;
    }
  }

  if(maxDist===0)return;
  const newRadius=Math.min(SCALE_MAX,maxDist*1.2);
  radiusKm=sliderIdxToRadius(radiusToSliderIdx(newRadius));
  _offscreen=null;_offscreenKey=null;
  Object.keys(_chartBg).forEach(k=>delete _chartBg[k]);
  drawMap();
}

// ---- デフォルト設定の保存・復元 ------------------------------------------
const LS_KEY='heatmap_defaults';

function saveDefaults(){
  const d={
    dist:     document.getElementById('sld-lon').value,
    center:   document.getElementById('inp-grid').value,
    fixed:    document.getElementById('chk-fixed').checked,
    band:     document.getElementById('sel-band').value,
    mode:     document.getElementById('sel-mode').value,
    power:    document.getElementById('sel-power').value,
    contest:  document.getElementById('sel-contest').value,
    years:    getSelectedYears(),
    crawl:    document.querySelector('input[name="rt-cycle"]:checked')?.value??'none',
    crawlTimer: document.querySelector('input[name="rt-crawl-timer"]:checked')?.value??'5',
    radiusKm: radiusKm,
    bright:   document.getElementById('sld-bright').value,
    rbn:      document.getElementById('chk-rbn').checked,
  };
  try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){}
  const btn=document.getElementById('btn-setdefault');
  btn.style.borderColor='#4af'; btn.style.color='#4af';
  setTimeout(()=>{btn.style.borderColor='';btn.style.color='';},800);
}

function applyDefaults(){
  let d;
  try{d=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){d=null;}
  if(!d)return false;
  if(d.dist!==undefined){
    document.getElementById('sld-lon').value=d.dist;
    document.getElementById('lbl-lon').textContent=d.dist+'km';
  }
  if(d.center){
    document.getElementById('inp-grid').value=d.center;
    const c=parseGrid(d.center);
    if(c){CY=c[0];CX=c[1];QX=CX;QY=CY;}
  }
  if(d.fixed!==undefined) document.getElementById('chk-fixed').checked=d.fixed;
  if(d.band!==undefined)  document.getElementById('sel-band').value=d.band;
  if(d.mode!==undefined)  document.getElementById('sel-mode').value=d.mode;
  if(d.power!==undefined) document.getElementById('sel-power').value=d.power;
  if(d.contest!==undefined) document.getElementById('sel-contest').value=d.contest;
  if(d.radiusKm!==undefined) radiusKm=+d.radiusKm;
  if(d.bright!==undefined){
    document.getElementById('sld-bright').value=d.bright;
    document.getElementById('lbl-bright').textContent=d.bright+'%';
  }
  if(d.crawl){
    const r=document.querySelector(`input[name="rt-cycle"][value="${d.crawl}"]`);
    if(r)r.checked=true;
  }
  if(d.crawlTimer){
    const r=document.querySelector(`input[name="rt-crawl-timer"][value="${d.crawlTimer}"]`);
    if(r)r.checked=true;
  }
  if(d.rbn!==undefined) document.getElementById('chk-rbn').checked=d.rbn;
  // Year: contestパネルを先に再構築してからチェックを反映
  if(d.years&&d.years.length>0){
    updateYearPanel(); // contestに合わせたパネルを構築
    document.querySelectorAll('#year-panel input[type=checkbox]').forEach(cb=>{
      cb.checked=d.years.includes(+cb.value);
    });
  }
  updateBandModeDisplay();
  return true;
}

document.getElementById('btn-setdefault').addEventListener('click',saveDefaults);

function updateStatus(){
  if(!allData)return;
  const years=allData.meta?.merged_years||[];
  const yStr=years.length===1?`${years[0]}`:`${years.join('+')}`;
  const base=allData._baseRecords?.length??0;
  const approxOn=allApproxData&&document.getElementById('chk-approx')?.checked;
  const approxN=approxOn?(allApproxData.records?.length??0):0;
  let s=`${base.toLocaleString()} records (${yStr})`;
  if(approxOn&&approxN>0) s+=`  (+${approxN.toLocaleString()} est.)`;
  const rbnOn=allRbnData&&document.getElementById('chk-rbn')?.checked;
  if(rbnOn){
    const rbnBase=allRbnData._baseRecords?.length??0;
    const rbnApproxOn=allRbnApproxData&&document.getElementById('chk-rbn-approx')?.checked;
    const rbnApproxN=rbnApproxOn?(allRbnApproxData.records?.length??0):0;
    s+=`  RBN: ${rbnBase.toLocaleString()}`;
    if(rbnApproxOn&&rbnApproxN>0) s+=` (+${rbnApproxN.toLocaleString()} est.)`;
  }
  document.getElementById('status').textContent=s;
}

// ---- データ読み込み・マージ ----------------------------------------------
async function loadData(){
  const contest=document.getElementById('sel-contest').value;
  const years=getSelectedYears();
  // 全キャッシュ・状態クリア
  stopAll();
  if(_blinkRaf){clearInterval(_blinkRaf);_blinkRaf=null;}
  _blinkLastTs=null;
  _offscreen=null; _offscreenKey=null;
  Object.keys(_chartBg).forEach(k=>delete _chartBg[k]);
  _stepIndex=null;
  _blinkCellCache=null;
  _rxCountPerYear={};
  allData=null;
  _blinkAlpha=1.0;_blinkDir=-1;
  _skipCharts=false;
  _wheelPending=false;
  clearTimeout(_chartDebounce);_chartDebounce=null;
  buildProj();
  c2.clearRect(0,0,cv.width,cv.height);
  updateBandModeDisplay();

  if(years.length===0){
    document.getElementById('status').textContent=isJa?'年を選択してください':'Please select a year';
    drawMap();
    if(!_blinkRaf){_blinkLastTs=null;_blinkRaf=setInterval(_blinkTick,16);}
    return;
  }

  document.getElementById('status').textContent='Loading QSO data…';
  const sld=document.getElementById('sld-hour');
  sld.value=0;
  updateInpHour(0);

  // 複数年のJSONを並列ロード
  const results=await Promise.all(years.map(y=>
    loadJSON([`./data/${contest}_${y}.json`]).then(d=>({year:y,data:d}))
  ));
  const loaded=results.filter(r=>r.data);
  if(loaded.length===0){
    document.getElementById('status').textContent=isJa?'Error: データが見つかりません':'Error: Data not found';
    drawMap();
    if(!_blinkRaf){_blinkLastTs=null;_blinkRaf=setInterval(_blinkTick,16);}
    return;
  }

  // マージ: 最初のmetaを基準にする
  const base=loaded[0].data;
  const resMin=base.meta?.time_resolution_min??60;
  const stepsPerDay=base.meta?.steps_per_day??24;

  // gridsをマージ（全年分のグリッドを統合）
  const mergedGrids={...base.grids};
  for(const{data}of loaded.slice(1)){
    if(data.grids)Object.assign(mergedGrids,data.grids);
  }

  // recordsをマージ: rec[7]に年を付加（rec[6]=power_codeを保持）
  const mergedRecords=[];
  const maxCountPerCell={};
  for(const{year,data}of loaded){
    if(!data.records)continue;
    for(const rec of data.records){
      // 新フォーマット rec: [rx4, band, mode, t_step, tx4, count, power_code]
      // マージ後:        [rx4, band, mode, t_step, tx4, count, power_code, year]
      const r=[rec[0],rec[1],rec[2],rec[3],rec[4],rec[5],rec[6]??0,year];
      mergedRecords.push(r);
      if(!maxCountPerCell[rec[0]]||rec[5]>maxCountPerCell[rec[0]])
        maxCountPerCell[rec[0]]=rec[5];
    }
  }

  allData={
    meta:{...base.meta, merged_years:years},
    grids:mergedGrids,
    records:mergedRecords,
    max_count_per_cell:Math.max(1,...Object.values(maxCountPerCell)),
    _baseGrids:{...mergedGrids},
    _baseRecords:mergedRecords,
    _baseMaxCount:Math.max(1,...Object.values(maxCountPerCell))
  };
  allApproxData=null;

  {
    const cfg_load=contestCfg();
    const totalSteps_load=cfg_load.hours===48 ? stepsPerDay*2 : stepsPerDay;
    sld.max=totalSteps_load-1;
    sld.style.width=(cfg_load.hours===48?'320px':'160px');
    // +1dチェックボックスの表示切替
    const plus1d=document.getElementById('utc-plus1d');
    if(plus1d) plus1d.style.display=(cfg_load.hours===48?'':'none');

    // _stepIndexを構築（48h=288ステップ、24h=144ステップ）
    // 24h: utc_day=1のレコードはt_step>=stepsPerDayになることがあるのでmodulo正規化
    const totalSteps_idx=totalSteps_load;
    _stepIndex=Array.from({length:totalSteps_idx},()=>[]);
    for(const rec of allData.records){
      const s=cfg_load.hours===48 ? rec[3] : ((rec[3]%stepsPerDay)+stepsPerDay)%stepsPerDay;
      if(s>=0&&s<totalSteps_idx) _stepIndex[s].push(rec);
    }
  }
  updateInpHour(0);

  updateStatus();

  // RBNデータ読み込み（チェックがあれば）
  await loadRbnData(contest, years);
  // approxデータ読み込み（チェックがあれば）
  await loadApproxData(contest, years);
  await loadRbnApproxData(contest, years);
  updateStatus();

  drawMap();
  if(!_blinkRaf){_blinkLastTs=null;_blinkRaf=setInterval(_blinkTick,16);}
}
async function loadRbnData(contest, years){
  allRbnData=null; _rbnStepIndex=null;
  document.getElementById('rbn-legend-row').style.display='none';
  ['box-rbn-spots','box-rbn-grids'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  if(!document.getElementById('chk-rbn')?.checked)return;

  // 年ごとにRBN JSONを並列ロード
  const results=await Promise.all(years.map(y=>
    loadJSON([`./data/${contest}_${y}_rbn.json`]).then(d=>({year:y,data:d}))
  ));
  const loaded=results.filter(r=>r.data);
  if(loaded.length===0)return;

  const base=loaded[0].data;
  const resMin=base.meta?.time_resolution_min??60;
  const stepsPerDay=base.meta?.steps_per_day??24;
  const mergedGrids={...base.grids};
  const mergedRecords=[];
  const maxCountPerCell={};
  for(const{year,data}of loaded){
    if(!data.records)continue;
    Object.assign(mergedGrids, data.grids||{});
    for(const rec of data.records){
      const r=[rec[0],rec[1],rec[2],rec[3],rec[4],rec[5],rec[6]??0,year];
      mergedRecords.push(r);
      if(!maxCountPerCell[rec[0]]||rec[5]>maxCountPerCell[rec[0]])
        maxCountPerCell[rec[0]]=rec[5];
    }
  }
  allRbnData={
    meta:{...base.meta},
    grids:mergedGrids,
    records:mergedRecords,
    max_count_per_cell:Math.max(1,...Object.values(maxCountPerCell)),
    _baseGrids:{...mergedGrids},
    _baseRecords:mergedRecords,
    _baseMaxCount:Math.max(1,...Object.values(maxCountPerCell))
  };
  allRbnApproxData=null;

  // RBNのt_stepをQSOデータの時間解像度に合わせて変換
  // step4_rbnとstep5_rbnを --time-resolution 10 で実行した場合は変換不要
  // 異なる解像度の場合はt_stepをスケール変換（1対1マッピング、展開はしない）
  const qsoResMin=allData?.meta?.time_resolution_min??60;
  const rbnResMin=base.meta?.time_resolution_min??60;
  const qsoStepsPerDay=allData?.meta?.steps_per_day??24;
  const cfg_rbn=contestCfg();
  const rbnTotalSteps=cfg_rbn.hours===48 ? qsoStepsPerDay*2 : qsoStepsPerDay;
  if(qsoResMin!==rbnResMin){
    console.warn(`RBN解像度(${rbnResMin}min)とQSO解像度(${qsoResMin}min)が異なります。`
      +` step4_rbn.py と step5_rbn.py を --time-resolution ${qsoResMin} で再実行してください。`);
    // 暫定: t_stepをスケール変換（精度は落ちる）
    for(const rec of allRbnData.records){
      const utcMin=rec[3]*rbnResMin;
      rec[3]=Math.floor(utcMin/qsoResMin);  // 48h対応: %は除去
    }
  }

  _rbnStepIndex=Array.from({length:rbnTotalSteps},()=>[]);
  for(const rec of allRbnData.records){
    // 24h: t_stepはutc_dayベースで144以上になることがあるのでmodulo正規化
    const s=cfg_rbn.hours===48 ? rec[3] : ((rec[3]%qsoStepsPerDay)+qsoStepsPerDay)%qsoStepsPerDay;
    if(s>=0&&s<rbnTotalSteps) _rbnStepIndex[s].push(rec);
  }
  document.getElementById('rbn-legend-row').style.display='';
  ['box-rbn-spots','box-rbn-grids'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='';});
  drawLegendBar('grad-bar-rbn', rbnColor);
}

document.getElementById('chk-rbn')?.addEventListener('change',()=>{
  const contest=document.getElementById('sel-contest').value;
  const years=getSelectedYears();
  loadRbnData(contest,years).then(()=>{updateStatus();drawMap();});
});

// ---- QSO approx データ -----------------------------------------------
function _rebuildStepIndex(){
  if(!allData)return;
  const cfg=contestCfg();
  const stepsPerDay=allData.meta?.steps_per_day??24;
  const totalSteps=cfg.hours===48?stepsPerDay*2:stepsPerDay;
  const approxOn=allApproxData&&document.getElementById('chk-approx')?.checked;
  // grids: baseに approx分をマージ（approx は base にないキーのみ追加）
  allData.grids=approxOn
    ?{...allData._baseGrids,...allApproxData.grids}
    :{...allData._baseGrids};
  const recs=approxOn
    ?[...allData._baseRecords,...allApproxData.records]
    :allData._baseRecords;
  allData.max_count_per_cell=approxOn
    ?Math.max(allData._baseMaxCount,allApproxData.max_count_per_cell??1)
    :allData._baseMaxCount;
  _stepIndex=Array.from({length:totalSteps},()=>[]);
  for(const rec of recs){
    const s=cfg.hours===48?rec[3]:((rec[3]%stepsPerDay)+stepsPerDay)%stepsPerDay;
    if(s>=0&&s<totalSteps)_stepIndex[s].push(rec);
  }
}

    if(!data.records)continue;
    Object.assign(mergedGrids,data.grids||{});
    for(const rec of data.records){
      const r=[rec[0],rec[1],rec[2],rec[3],rec[4],rec[5],rec[6]??0,year];
      mergedRecords.push(r);
      if(!maxCountPerCell[rec[0]]||rec[5]>maxCountPerCell[rec[0]])
        maxCountPerCell[rec[0]]=rec[5];

    meta:{...base.meta},
